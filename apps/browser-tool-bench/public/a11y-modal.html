<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>键盘可访问性 · Bench 靶场</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <style>
    .backdrop { position: fixed; inset: 0; background: rgba(31, 35, 41, 0.55); display: grid; place-items: center; }
    .dialog { width: min(420px, calc(100vw - 32px)); background: #fff; border-radius: 10px; padding: 20px; }
    .fake-button { display: inline-block; margin-top: 16px; padding: 9px 20px; border-radius: 6px; background: #2b5cff; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <header class="site"><a class="brand" href="/">Bench 靶场</a></header>
  <main>
    <div class="card">
      <h1>偏好设置</h1>
      <button id="open-modal">打开偏好设置</button>
      <p class="hint" id="save-result">尚未保存</p>
    </div>
  </main>
  <div class="backdrop" id="backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title">通知偏好</h2>
      <label for="notify-email">通知邮箱</label>
      <input id="notify-email" data-trap-focus value="agent@bench.dev" />
      <div class="fake-button save-preferences" role="button" id="save-preferences">保存偏好</div>
      <button type="button" data-trap-focus id="close-modal">关闭</button>
    </section>
  </div>
  <script>
    const backdrop = document.getElementById("backdrop");
    const openBtn = document.getElementById("open-modal");
    const closeBtn = document.getElementById("close-modal");
    const saveBtn = document.getElementById("save-preferences");

    openBtn.addEventListener("click", () => {
      backdrop.hidden = false;
      document.getElementById("notify-email").focus();
    });

    closeBtn.addEventListener("click", () => {
      backdrop.hidden = true;
      openBtn.focus();
    });

    saveBtn.addEventListener("click", () => {
      document.getElementById("save-result").textContent = "保存成功：A11Y-204";
      backdrop.hidden = true;
    });

    backdrop.addEventListener("keydown", (event) => {
      if (event.key !== "Tab") return;
      const focusables = Array.from(backdrop.querySelectorAll("[data-trap-focus]"));
      const current = focusables.indexOf(document.activeElement);
      if (event.shiftKey && current === 0) {
        event.preventDefault();
        focusables[focusables.length - 1].focus();
      } else if (!event.shiftKey && current === focusables.length - 1) {
        event.preventDefault();
        focusables[0].focus();
      }
    });
  </script>
</body>
</html>
