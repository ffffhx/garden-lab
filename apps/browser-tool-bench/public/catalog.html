<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品目录 · Bench 靶场</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <style>
    /* 故意做得"脏"一点：嵌套 div、价格带千分位符号、混入无关节点 */
    .prod { display: flex; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid #eceef1; }
    .prod .meta span.x-id { display: none; }
    .prod .pr i { font-style: normal; color: #d4380d; font-weight: 700; }
  </style>
</head>
<body>
  <header class="site">
    <a class="brand" href="/">Bench 靶场</a>
    <a href="/dashboard">控制台</a>
  </header>
  <main>
    <div class="card">
      <h1>商品目录</h1>
      <p class="muted">共 <span id="total">--</span> 件商品，分页展示。</p>
      <div id="list"></div>
      <button id="next-page" hidden>加载第 2 页</button>
    </div>
  </main>
  <script>
    const list = document.getElementById("list");
    const nextBtn = document.getElementById("next-page");

    function render(items) {
      for (const p of items) {
        const row = document.createElement("div");
        row.className = "prod";
        const priceText = "¥ " + p.price.toLocaleString("zh-CN", { minimumFractionDigits: 2 });
        row.innerHTML = `
          <div class="meta">
            <span class="x-id">#${p.id}</span>
            <div><strong>${p.name}</strong>${p.stock === 0 ? '<span class="badge">缺货</span>' : ""}</div>
            <div class="muted">库存 ${p.stock} 件</div>
          </div>
          <div class="pr"><i>${priceText}</i></div>`;
        list.appendChild(row);
      }
    }

    function load(page) {
      fetch(`/api/products?page=${page}`)
        .then((r) => r.json())
        .then((data) => {
          document.getElementById("total").textContent = data.total;
          render(data.items);
          nextBtn.hidden = !data.hasMore;
        });
    }

    nextBtn.addEventListener("click", () => {
      nextBtn.hidden = true;
      load(2);
    });
    load(1);
  </script>
</body>
</html>
