<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hydration 状态不一致 · Bench 靶场</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <header class="site"><a class="brand" href="/">Bench 靶场</a></header>
  <main>
    <div class="card" id="task-card" data-component="TaskSummary">
      <h1>任务概览</h1>
      <p>待办数量：<strong id="pending-count" data-ssr-value="8">8</strong></p>
      <p>套餐：<strong id="plan-name" data-ssr-value="starter">starter</strong></p>
      <p class="hint" id="hydration-status">等待客户端状态接管…</p>
    </div>
  </main>
  <script>
    window.__BENCH_STORE__ = {
      traceId: "HYD-908",
      component: "TaskSummary",
      clientState: { pendingTasks: 9, planName: "team-pro" },
      ssrState: { pendingTasks: 8, planName: "starter" },
    };

    setTimeout(() => {
      const store = window.__BENCH_STORE__;
      console.error("[hydration mismatch]", {
        traceId: store.traceId,
        component: store.component,
        fields: ["pendingTasks", "planName"],
        ssrState: store.ssrState,
        clientState: store.clientState,
      });
      document.getElementById("pending-count").textContent = store.clientState.pendingTasks;
      document.getElementById("plan-name").textContent = store.clientState.planName;
      document.getElementById("hydration-status").textContent = `客户端已接管，traceId=${store.traceId}`;
    }, 350);
  </script>
</body>
</html>
