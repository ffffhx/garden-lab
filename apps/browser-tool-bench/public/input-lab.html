<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文件输入 · Bench 靶场</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <style>
    .drop-zone { border: 2px dashed #cfd3da; border-radius: 8px; padding: 24px; text-align: center; }
    .drop-zone.over { border-color: #2b5cff; background: #f0f6ff; }
  </style>
</head>
<body>
  <header class="site"><a class="brand" href="/">Bench 靶场</a></header>
  <main>
    <div class="card">
      <h1>上传凭证</h1>
      <p class="muted">选择或拖入 fixture 文件，页面会在本地解析 token。</p>
      <input id="token-file" type="file" accept=".txt" />
      <div class="drop-zone" id="drop-zone">也可以把文件拖到这里</div>
      <p class="hint" id="upload-result">等待文件…</p>
    </div>
  </main>
  <script>
    async function readFile(file) {
      const text = await file.text();
      const token = (text.match(/token=(\S+)/) || [])[1] || "UNKNOWN";
      const bytes = new TextEncoder().encode(text).length;
      document.getElementById("upload-result").textContent =
        `文件 ${file.name}，${bytes} bytes，token=${token}`;
    }

    document.getElementById("token-file").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (file) readFile(file);
    });

    const dropZone = document.getElementById("drop-zone");
    dropZone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropZone.classList.add("over");
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
    dropZone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropZone.classList.remove("over");
      const file = event.dataTransfer.files[0];
      if (file) readFile(file);
    });
  </script>
</body>
</html>
