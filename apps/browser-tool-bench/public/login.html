<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · Bench 靶场</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <header class="site"><a class="brand" href="/">Bench 靶场</a></header>
  <main>
    <div class="card" style="max-width: 420px; margin: 48px auto;">
      <h1>登录</h1>
      <p class="hint">测试账号：agent@bench.dev / bench-2026</p>
      <form id="login-form">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" />
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
        <button type="submit">登录</button>
        <p class="error" id="login-error" hidden></p>
      </form>
      <p class="muted"><a href="#">忘记密码</a></p>
    </div>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("login-error");
      errEl.hidden = true;
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      if (res.ok) {
        location.href = "/dashboard";
      } else {
        const data = await res.json().catch(() => ({}));
        errEl.textContent = data.message || "登录失败";
        errEl.hidden = false;
      }
    });
  </script>
</body>
</html>
