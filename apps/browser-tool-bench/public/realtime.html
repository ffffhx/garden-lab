<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSE 实时流 · Bench 靶场</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <header class="site"><a class="brand" href="/">Bench 靶场</a></header>
  <main>
    <div class="card">
      <h1>实时事件流</h1>
      <p class="muted">点击开始后，页面会通过 EventSource 接收 5 条事件。</p>
      <button id="start-stream">开始接收</button>
      <p id="stream-status" class="muted">尚未开始</p>
      <ul class="feed" id="events"></ul>
    </div>
  </main>
  <script>
    const eventsEl = document.getElementById("events");
    const statusEl = document.getElementById("stream-status");
    const received = [];

    function appendEvent(event) {
      received.push(event);
      const li = document.createElement("li");
      li.textContent = `${event.id} · ${event.type} · ${event.code || event.name || event.message}`;
      eventsEl.appendChild(li);
      if (received.length === 5) {
        statusEl.textContent = "接收完成：5 条事件，关键告警 STREAM-721";
      }
    }

    document.getElementById("start-stream").addEventListener("click", () => {
      eventsEl.innerHTML = "";
      received.length = 0;
      statusEl.textContent = "正在接收…";
      const stream = new EventSource("/api/realtime-events");
      for (const type of ["connected", "metric", "notice", "alert"]) {
        stream.addEventListener(type, (event) => {
          appendEvent(JSON.parse(event.data));
          if (received.length === 5) stream.close();
        });
      }
      stream.onerror = () => {
        if (received.length < 5) statusEl.textContent = "连接异常，事件未收全";
        stream.close();
      };
    });
  </script>
</body>
</html>
