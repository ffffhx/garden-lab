<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>成员列表 · Bench 靶场</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <header class="site">
    <a class="brand" href="/">Bench 靶场</a>
    <a href="/dashboard">控制台</a>
  </header>
  <main>
    <div class="card">
      <h1>团队成员</h1>
      <div id="content"><p class="muted">加载中…</p></div>
    </div>
  </main>
  <script>
    fetch("/api/users")
      .then((r) => r.json())
      .then(({ users }) => {
        const box = document.getElementById("content");
        if (!users || users.length === 0) {
          box.innerHTML = `
            <div class="empty-state">
              <div class="icon">🪴</div>
              <p>暂无成员，去邀请第一位伙伴吧</p>
              <button class="secondary">邀请成员</button>
            </div>`;
          return;
        }
        box.innerHTML = `
          <table>
            <thead><tr><th>姓名</th><th>角色</th><th>加入时间</th></tr></thead>
            <tbody>${users
              .map((u) => `<tr><td>${u.name}</td><td>${u.role}</td><td>${u.joined}</td></tr>`)
              .join("")}</tbody>
          </table>`;
      });
  </script>
</body>
</html>
