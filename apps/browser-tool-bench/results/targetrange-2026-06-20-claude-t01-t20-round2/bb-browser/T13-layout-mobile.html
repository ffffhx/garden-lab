<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>移动端布局 · Bench 靶场</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <style>
    .checkout-total { font-size: 28px; font-weight: 700; }
    .mobile-support-bar { display: none; }
    .pay-result { font-weight: 700; color: #00a86b; }
    @media (max-width: 480px) {
      main { padding-bottom: 24px; }
      .checkout-actions {
        position: fixed;
        left: 20px;
        right: 20px;
        bottom: 40px;
        z-index: 10;
      }
      #pay-button { width: 100%; }
      .mobile-support-bar {
        display: block;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 118px;
        padding: 14px 20px;
        background: rgba(31, 35, 41, 0.94);
        color: #fff;
        z-index: 20;
        box-shadow: 0 -8px 18px rgba(0, 0, 0, 0.18);
      }
      .mobile-support-bar button {
        margin-top: 8px;
        background: #fff;
        color: #1f2329;
      }
    }
  </style>
</head>
<body>
  <header class="site"><a class="brand" href="/">Bench 靶场</a></header>
  <main>
    <div class="card">
      <h1>移动端结算</h1>
      <p class="muted">请在 390px 宽的移动视口里检查底部支付按钮。</p>
      <p>订单：MOBILE-ORDER-39</p>
      <p class="checkout-total">¥187.50</p>
      <div class="checkout-actions">
        <button id="pay-button">提交支付</button>
      </div>
      <p class="pay-result" id="pay-result" hidden></p>
    </div>
  </main>
  <aside class="mobile-support-bar" data-bug="overlaps-pay-button">
    <strong>在线客服</strong>
    <div>移动端帮助条错误覆盖了支付按钮。</div>
    <button type="button">联系客服</button>
  </aside>
  <script>
    document.getElementById("pay-button").addEventListener("click", () => {
      const result = document.getElementById("pay-result");
      result.textContent = "支付确认码：MOBILE-39";
      result.hidden = false;
    });
  </script>
</body>
</html>
