services:
  job-tracker:
    build: .
    container_name: job-tracker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8796:8796"
    environment:
      COOKIE_SECURE: "true"
      SHARING: "shared"
      PUBLIC_URL: "https://124-221-36-36.anyip.dev:8443/applications/"
    volumes:
      - tracker-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  tracker-data:
