<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Codex 与 Claude Code 最近一个月对照</title>
  <desc id="desc">对比 Codex 和 Claude Code 最近一个月更新的产品重心。</desc>
  <rect width="1200" height="760" fill="#fffaf0"/>
  <text x="70" y="76" fill="#111827" font-family="Arial, 'PingFang SC', sans-serif" font-size="36" font-weight="800">同样是 Coding Agent，两条路线略有不同</text>
  <text x="72" y="118" fill="#64748b" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Codex 更像常驻工作台，Claude Code 更像本地 CLI 与云端编排平台。</text>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <rect x="80" y="175" width="500" height="455" rx="28" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="125" y="235" fill="#1e3a8a" font-size="34" font-weight="800">Codex</text>
    <text x="125" y="285" fill="#1e293b" font-size="23" font-weight="700">常驻桌面工作台</text>
    <text x="125" y="345" fill="#334155" font-size="20">Browser Use / Computer Use</text>
    <text x="125" y="385" fill="#334155" font-size="20">Thread automations / Memory</text>
    <text x="125" y="425" fill="#334155" font-size="20">Codex Pets 状态浮层</text>
    <text x="125" y="465" fill="#334155" font-size="20">插件、MCP、Bedrock、企业计费</text>
    <text x="125" y="540" fill="#1e3a8a" font-size="22" font-weight="700">关键词：让 Agent 一直在你旁边</text>
    <rect x="620" y="175" width="500" height="455" rx="28" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="665" y="235" fill="#5b21b6" font-size="34" font-weight="800">Claude Code</text>
    <text x="665" y="285" fill="#1e293b" font-size="23" font-weight="700">本地 CLI + 云端编排平台</text>
    <text x="665" y="345" fill="#334155" font-size="20">Opus 4.7 / xhigh effort</text>
    <text x="665" y="385" fill="#334155" font-size="20">Routines / Ultraplan / Monitor</text>
    <text x="665" y="425" fill="#334155" font-size="20">Ultrareview / Claude Security</text>
    <text x="665" y="465" fill="#334155" font-size="20">MCP、Hooks、原生 CLI、企业治理</text>
    <text x="665" y="540" fill="#5b21b6" font-size="22" font-weight="700">关键词：让 Agent 接进开发流程</text>
  </g>
  <path d="M575 405 C600 375 600 435 625 405" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
</svg>
