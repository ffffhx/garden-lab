      .small { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #586771; }
      .tiny { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #61717c; letter-spacing: 0; }
      .light { fill: #ffffff; }
    </style>
