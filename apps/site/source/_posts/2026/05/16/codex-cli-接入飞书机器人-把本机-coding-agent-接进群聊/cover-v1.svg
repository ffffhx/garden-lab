<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Codex CLI 接入飞书机器人</title>
  <desc id="desc">展示飞书消息通过阿里云 hub 与 Mac worker 触发 Codex CLI，再把结果回复到群聊。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff4df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <rect x="72" y="72" width="1256" height="676" rx="34" fill="#fffdfa" stroke="#0f172a" stroke-opacity="0.1" filter="url(#shadow)"/>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <text x="124" y="158" fill="#0f766e" font-size="34" font-weight="700">Feishu Bot × Codex CLI</text>
    <text x="124" y="262" fill="#111827" font-size="70" font-weight="800">阿里云做入口</text>
    <text x="124" y="350" fill="#111827" font-size="70" font-weight="800">Mac 跑 Codex</text>
    <text x="128" y="424" fill="#475569" font-size="30">事件回调、任务队列、非交互执行、按群续聊</text>
    <g transform="translate(124 520)">
      <rect width="208" height="74" rx="18" fill="#dcfce7" stroke="#86efac"/>
      <text x="30" y="46" fill="#166534" font-size="25" font-weight="700">飞书消息</text>
    </g>
    <g transform="translate(358 520)">
      <rect width="208" height="74" rx="18" fill="#dbeafe" stroke="#93c5fd"/>
      <text x="30" y="46" fill="#1e3a8a" font-size="25" font-weight="700">阿里云 hub</text>
    </g>
    <g transform="translate(592 520)">
      <rect width="208" height="74" rx="18" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="30" y="46" fill="#92400e" font-size="25" font-weight="700">Mac worker</text>
    </g>
    <g transform="translate(826 520)">
      <rect width="240" height="74" rx="18" fill="#ede9fe" stroke="#c4b5fd"/>
      <text x="30" y="46" fill="#5b21b6" font-size="25" font-weight="700">codex resume</text>
    </g>
    <g transform="translate(1018 142)">
      <rect x="0" y="0" width="216" height="158" rx="28" fill="#0f172a"/>
      <rect x="26" y="32" width="136" height="18" rx="9" fill="#34d399"/>
      <rect x="26" y="70" width="164" height="18" rx="9" fill="#60a5fa"/>
      <rect x="26" y="108" width="112" height="18" rx="9" fill="#fbbf24"/>
      <rect x="-94" y="220" width="310" height="190" rx="28" fill="#ecfdf5" stroke="#86efac"/>
      <circle cx="-52" cy="268" r="22" fill="#22c55e"/>
      <text x="-18" y="276" fill="#14532d" font-size="28" font-weight="800">@Codex</text>
      <rect x="-52" y="306" width="212" height="22" rx="11" fill="#bbf7d0"/>
      <rect x="-52" y="346" width="168" height="22" rx="11" fill="#bbf7d0"/>
      <path d="M135 128 C214 168 236 248 176 318" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
      <path d="M176 318 l-4 -34 l32 13" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
