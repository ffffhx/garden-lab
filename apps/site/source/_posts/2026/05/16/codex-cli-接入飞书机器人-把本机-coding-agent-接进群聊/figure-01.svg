<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">飞书机器人触发 Codex 的角色分工</title>
  <desc id="desc">飞书、阿里云 hub、Mac worker、Codex CLI 和 lark-cli 的职责边界。</desc>
  <rect width="1200" height="760" fill="#fbf9f3"/>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <text x="70" y="78" fill="#111827" font-size="36" font-weight="800">这不是把 App 搬进飞书，而是拆出公网入口和本机执行</text>
    <text x="72" y="120" fill="#64748b" font-size="21">飞书负责入口，阿里云负责队列，Mac worker 负责执行，Codex CLI 留在本机。</text>
    <g transform="translate(70 205)">
      <rect width="220" height="160" rx="22" fill="#dcfce7" stroke="#86efac"/>
      <text x="32" y="54" fill="#166534" font-size="26" font-weight="800">飞书机器人</text>
      <text x="32" y="92" fill="#1f2937" font-size="19">消息事件</text>
      <text x="32" y="124" fill="#1f2937" font-size="19">机器人回复</text>
    </g>
    <g transform="translate(350 205)">
      <rect width="220" height="160" rx="22" fill="#e0f2fe" stroke="#7dd3fc"/>
      <text x="32" y="54" fill="#075985" font-size="26" font-weight="800">阿里云 hub</text>
      <text x="32" y="92" fill="#1f2937" font-size="19">稳定 HTTPS</text>
      <text x="32" y="124" fill="#1f2937" font-size="19">验签与排队</text>
    </g>
    <g transform="translate(630 205)">
      <rect width="220" height="160" rx="22" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="32" y="54" fill="#92400e" font-size="26" font-weight="800">Mac worker</text>
      <text x="32" y="92" fill="#1f2937" font-size="19">主动拉任务</text>
      <text x="32" y="124" fill="#1f2937" font-size="19">续聊与回复</text>
    </g>
    <g transform="translate(910 205)">
      <rect width="220" height="160" rx="22" fill="#ede9fe" stroke="#c4b5fd"/>
      <text x="32" y="54" fill="#5b21b6" font-size="26" font-weight="800">Codex CLI</text>
      <text x="32" y="92" fill="#1f2937" font-size="19">exec 子进程</text>
      <text x="32" y="124" fill="#1f2937" font-size="19">仓库内执行</text>
    </g>
    <path d="M300 285 L338 285" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M330 270 L350 285 L330 300" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M580 285 L618 285" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M610 270 L630 285 L610 300" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M860 285 L898 285" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M890 270 L910 285 L890 300" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(186 465)">
      <rect width="828" height="150" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="34" y="48" fill="#0f172a" font-size="25" font-weight="800">关键边界</text>
      <text x="34" y="88" fill="#475569" font-size="20">飞书不直接执行命令，阿里云不直接跑 Codex。</text>
      <text x="34" y="122" fill="#475569" font-size="20">Mac 主动拉任务后再启动子进程，本机端口不暴露公网。</text>
    </g>
  </g>
</svg>
