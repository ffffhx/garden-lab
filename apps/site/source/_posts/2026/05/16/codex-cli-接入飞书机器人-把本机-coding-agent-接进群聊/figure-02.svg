<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">飞书消息到 Codex 回复的完整链路</title>
  <desc id="desc">从用户消息、飞书事件、阿里云 hub、Mac worker、codex exec 到机器人回复的流程图。</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <text x="70" y="78" fill="#111827" font-size="36" font-weight="800">一条飞书消息会先入队，再由 Mac 拉回本机执行</text>
    <text x="72" y="120" fill="#64748b" font-size="21">中间最重要的是 hub 验签排队、worker 主动拉取、output-last-message 和机器人回复。</text>
    <g transform="translate(90 190)">
      <rect width="280" height="108" rx="20" fill="#dcfce7" stroke="#86efac"/>
      <text x="28" y="46" fill="#166534" font-size="24" font-weight="800">1. 群聊 @ 机器人</text>
      <text x="28" y="78" fill="#334155" font-size="18">用户输入自然语言任务</text>
    </g>
    <g transform="translate(460 190)">
      <rect width="280" height="108" rx="20" fill="#e0f2fe" stroke="#7dd3fc"/>
      <text x="28" y="46" fill="#075985" font-size="24" font-weight="800">2. 飞书推事件</text>
      <text x="28" y="78" fill="#334155" font-size="18">POST /lark/events</text>
    </g>
    <g transform="translate(830 190)">
      <rect width="280" height="108" rx="20" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="28" y="46" fill="#92400e" font-size="24" font-weight="800">3. hub 验签排队</text>
      <text x="28" y="78" fill="#334155" font-size="18">token、白名单、队列文件</text>
    </g>
    <g transform="translate(90 430)">
      <rect width="280" height="108" rx="20" fill="#ede9fe" stroke="#c4b5fd"/>
      <text x="28" y="46" fill="#5b21b6" font-size="24" font-weight="800">4. worker 拉任务</text>
      <text x="28" y="78" fill="#334155" font-size="18">POST /worker/tasks/claim</text>
    </g>
    <g transform="translate(460 430)">
      <rect width="280" height="108" rx="20" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="28" y="46" fill="#991b1b" font-size="24" font-weight="800">5. 本机 Codex</text>
      <text x="28" y="78" fill="#334155" font-size="18">exec / resume / 输出文件</text>
    </g>
    <g transform="translate(830 430)">
      <rect width="280" height="108" rx="20" fill="#ecfccb" stroke="#bef264"/>
      <text x="28" y="46" fill="#3f6212" font-size="24" font-weight="800">6. 回复飞书</text>
      <text x="28" y="78" fill="#334155" font-size="18">lark-cli / OpenAPI</text>
    </g>
    <path d="M376 244 L444 244" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M434 229 L460 244 L434 259" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M746 244 L814 244" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M804 229 L830 244 L804 259" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M970 310 C970 380 230 360 230 414" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M214 392 L230 430 L248 393" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M376 484 L444 484" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M434 469 L460 484 L434 499" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M746 484 L814 484" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M804 469 L830 484 L804 499" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="640" fill="#475569" font-size="20">注意：飞书回调要快速返回 200，真正耗时的 Codex 任务由 Mac worker 后台领取并执行。</text>
  </g>
</svg>
