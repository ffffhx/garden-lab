    <rect x="20" y="34" width="170" height="272" rx="18" fill="#f7fafc"/>
    <circle cx="105" cy="318" r="9" fill="#9fb3c8"/>
    <text x="105" y="116" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="700" fill="#334e68">手机端</text>
    <text x="105" y="158" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#486581">查看线程</text>
    <text x="105" y="190" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#486581">发送指令</text>
    <text x="105" y="222" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#486581">审批动作</text>
  </g>
  <g transform="translate(492 286)">
