  <path d="M748 381 C795 382 817 394 842 430" fill="none" stroke="#2f5f6f" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M846 466 C744 566 432 570 328 468" fill="none" stroke="#806443" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12" marker-end="url(#arrow)"/>
