    <text x="128" y="112" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#20543a">云端 Relay</text>
    <text x="128" y="148" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#2f5f4d">转发 JSON-RPC Envelope</text>
  </g>
  <g transform="translate(844 284)">
