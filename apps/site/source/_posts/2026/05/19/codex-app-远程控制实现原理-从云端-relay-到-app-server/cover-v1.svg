<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Codex App 远程控制实现原理封面</title>
  <desc id="desc">手机、云端 Relay 和本机 App Server 通过安全通道连接的技术文章封面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6efe4"/>
      <stop offset="48%" stop-color="#edf3ee"/>
      <stop offset="100%" stop-color="#e9eef7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#253047" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5f6f"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="64" y="58" width="1072" height="644" rx="28" fill="#ffffff" opacity="0.74" filter="url(#shadow)"/>
  <text x="100" y="142" font-family="Arial, 'PingFang SC', sans-serif" font-size="54" font-weight="700" fill="#1f2933">Codex App 远程控制实现原理</text>
  <text x="104" y="194" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" fill="#52606d">从云端 Relay 到本机 App Server 的公开源码拆解</text>
  <g transform="translate(118 278)">
