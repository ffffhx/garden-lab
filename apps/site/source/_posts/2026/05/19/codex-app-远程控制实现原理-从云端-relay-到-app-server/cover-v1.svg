    <rect x="18" y="22" width="202" height="102" rx="10" fill="#f7fafc"/>
    <rect x="84" y="142" width="70" height="14" rx="7" fill="#52606d"/>
    <rect x="54" y="158" width="130" height="16" rx="8" fill="#9fb3c8"/>
    <text x="119" y="74" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="25" font-weight="700" fill="#1f2933">PC / Mac</text>
    <text x="119" y="108" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#52606d">Codex App Server</text>
