<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Codex 远程控制总体链路</title>
  <desc id="desc">展示手机、云端 Relay、本机 App Server、本地工具之间的消息流</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31546c"/>
    </marker>
    <style>
      .title{font:700 34px Arial,'PingFang SC',sans-serif;fill:#1f2933}
      .sub{font:18px Arial,'PingFang SC',sans-serif;fill:#52606d}
      .h{font:700 24px Arial,'PingFang SC',sans-serif;fill:#243b53}
      .p{font:17px Arial,'PingFang SC',sans-serif;fill:#486581}
      .small{font:15px Arial,'PingFang SC',sans-serif;fill:#627d98}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f7f4ed"/>
  <text x="70" y="72" class="title">总体链路：远端界面接入同一个本机 Harness</text>
  <text x="72" y="108" class="sub">Relay 只负责连通和转发，真正读写文件、跑命令、审批动作的是本机 App Server 与 Codex Core。</text>
  <g transform="translate(70 178)">
    <rect width="230" height="160" rx="18" fill="#e7eef8" stroke="#486581" stroke-width="3"/>
    <text x="115" y="52" text-anchor="middle" class="h">手机 / Web</text>
    <text x="115" y="88" text-anchor="middle" class="p">发送用户输入</text>
    <text x="115" y="118" text-anchor="middle" class="p">查看事件流</text>
    <text x="115" y="148" text-anchor="middle" class="small">client_id / stream_id</text>
  </g>
  <g transform="translate(470 168)">
    <path d="M88 68 C112 20 178 12 212 54 C250 48 296 80 296 128 C296 184 254 214 202 214 H86 C38 214 0 184 0 136 C0 96 34 68 88 68Z" fill="#dff3e8" stroke="#2f855a" stroke-width="3"/>
    <text x="148" y="120" text-anchor="middle" class="h">ChatGPT Relay</text>
    <text x="148" y="154" text-anchor="middle" class="p">注册机器</text>
    <text x="148" y="184" text-anchor="middle" class="p">转发 envelope</text>
  </g>
  <g transform="translate(890 178)">
    <rect width="240" height="160" rx="18" fill="#fff8e8" stroke="#b7791f" stroke-width="3"/>
    <text x="120" y="52" text-anchor="middle" class="h">本机 App Server</text>
    <text x="120" y="88" text-anchor="middle" class="p">JSON-RPC</text>
    <text x="120" y="118" text-anchor="middle" class="p">Thread / Turn / Item</text>
    <text x="120" y="148" text-anchor="middle" class="small">ConnectionOrigin::RemoteControl</text>
  </g>
  <g transform="translate(846 486)">
    <rect width="328" height="150" rx="18" fill="#f0f5f4" stroke="#557c7b" stroke-width="3"/>
    <text x="164" y="48" text-anchor="middle" class="h">本地执行资源</text>
    <text x="164" y="84" text-anchor="middle" class="p">项目文件 / Git / 终端</text>
    <text x="164" y="114" text-anchor="middle" class="p">浏览器 / 插件 / MCP</text>
  </g>
  <path d="M300 258 H470" fill="none" stroke="#31546c" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M766 258 H890" fill="none" stroke="#31546c" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1010 338 V486" fill="none" stroke="#31546c" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M890 292 C706 450 438 446 300 292" fill="none" stroke="#8a6f3d" stroke-width="3" stroke-dasharray="9 10" marker-end="url(#arrow)"/>
  <text x="355" y="238" class="small">用户输入 / 审批</text>
  <text x="786" y="238" class="small">ClientEnvelope</text>
  <text x="1030" y="412" class="small">本机执行</text>
  <text x="520" y="454" class="small">ServerEnvelope / 状态 / diff / 输出</text>
</svg>
