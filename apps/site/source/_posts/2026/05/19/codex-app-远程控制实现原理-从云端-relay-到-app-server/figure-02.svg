<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">公开源码边界</title>
  <desc id="desc">展示开源的本机侧实现和未公开的云端服务端边界</desc>
  <defs>
    <style>
      .title{font:700 34px Arial,'PingFang SC',sans-serif;fill:#1f2933}
      .sub{font:18px Arial,'PingFang SC',sans-serif;fill:#52606d}
      .h{font:700 24px Arial,'PingFang SC',sans-serif;fill:#243b53}
      .p{font:17px Arial,'PingFang SC',sans-serif;fill:#486581}
      .code{font:16px Menlo,Consolas,monospace;fill:#334e68}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f5f7fa"/>
  <text x="70" y="70" class="title">公开源码边界：本机侧清楚，云端侧仍是黑盒</text>
  <text x="72" y="106" class="sub">openai/codex 公开了 remote_control transport，但 relay 服务端、手机 UI 和设备授权策略没有完整公开。</text>
  <g transform="translate(68 164)">
    <rect width="500" height="478" rx="20" fill="#edf7ed" stroke="#2f855a" stroke-width="3"/>
    <text x="250" y="50" text-anchor="middle" class="h">公开可读</text>
    <rect x="36" y="86" width="428" height="56" rx="10" fill="#ffffff"/>
    <text x="58" y="122" class="code">app-server-transport/remote_control</text>
    <rect x="36" y="160" width="428" height="56" rx="10" fill="#ffffff"/>
    <text x="58" y="196" class="code">app-server request processors</text>
    <rect x="36" y="234" width="428" height="56" rx="10" fill="#ffffff"/>
    <text x="58" y="270" class="code">app-server-daemon remote client</text>
    <rect x="36" y="308" width="428" height="56" rx="10" fill="#ffffff"/>
    <text x="58" y="344" class="code">state remote_control_enrollments</text>
    <rect x="36" y="382" width="428" height="56" rx="10" fill="#ffffff"/>
    <text x="58" y="418" class="code">CLI remote-control command</text>
  </g>
  <g transform="translate(632 164)">
    <rect width="500" height="478" rx="20" fill="#fff4e5" stroke="#b7791f" stroke-width="3"/>
    <text x="250" y="50" text-anchor="middle" class="h">未完整公开</text>
    <rect x="36" y="86" width="428" height="56" rx="10" fill="#ffffff"/>
    <text x="58" y="122" class="p">ChatGPT relay 服务端实现</text>
    <rect x="36" y="160" width="428" height="56" rx="10" fill="#ffffff"/>
    <text x="58" y="196" class="p">手机 / Web 选择机器的 UI 细节</text>
    <rect x="36" y="234" width="428" height="56" rx="10" fill="#ffffff"/>
    <text x="58" y="270" class="p">设备授权、撤销和风控策略</text>
    <rect x="36" y="308" width="428" height="56" rx="10" fill="#ffffff"/>
    <text x="58" y="344" class="p">企业策略与合规日志服务端细节</text>
    <rect x="36" y="382" width="428" height="56" rx="10" fill="#ffffff"/>
    <text x="58" y="418" class="p">桌面 App UI 壳的完整源码</text>
  </g>
  <line x1="600" y1="164" x2="600" y2="642" stroke="#9fb3c8" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="600" y="686" text-anchor="middle" class="sub">文章只把公开源码能证明的部分写成定论</text>
</svg>
