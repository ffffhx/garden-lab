<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Enrollment 与 WebSocket 建连流程</title>
  <desc id="desc">展示本机 App Server 如何注册到 relay 并建立 WebSocket 长连接</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31546c"/>
    </marker>
    <style>
      .title{font:700 34px Arial,'PingFang SC',sans-serif;fill:#1f2933}
      .sub{font:18px Arial,'PingFang SC',sans-serif;fill:#52606d}
      .h{font:700 23px Arial,'PingFang SC',sans-serif;fill:#243b53}
      .p{font:16px Arial,'PingFang SC',sans-serif;fill:#486581}
      .code{font:15px Menlo,Consolas,monospace;fill:#334e68}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fbf7ef"/>
  <text x="70" y="70" class="title">Enrollment：把本机登记为一个可被选择的环境</text>
  <text x="72" y="106" class="sub">本机先拿 server_id / environment_id，再用它们建立 WebSocket 长连接。</text>
  <g transform="translate(70 176)">
    <rect width="300" height="430" rx="18" fill="#e7eef8" stroke="#486581" stroke-width="3"/>
    <text x="150" y="50" text-anchor="middle" class="h">本机 App Server</text>
    <text x="34" y="96" class="p">ChatGPT auth</text>
    <text x="34" y="128" class="p">installation_id</text>
    <text x="34" y="160" class="p">server_name</text>
    <text x="34" y="192" class="p">os / arch / version</text>
    <rect x="34" y="270" width="232" height="96" rx="12" fill="#ffffff"/>
    <text x="52" y="306" class="code">SQLite enrollment</text>
    <text x="52" y="334" class="code">server_id</text>
    <text x="52" y="362" class="code">environment_id</text>
  </g>
  <g transform="translate(836 176)">
    <rect width="294" height="430" rx="18" fill="#dff3e8" stroke="#2f855a" stroke-width="3"/>
    <text x="147" y="50" text-anchor="middle" class="h">ChatGPT Relay</text>
    <rect x="34" y="92" width="226" height="80" rx="12" fill="#ffffff"/>
    <text x="54" y="128" class="code">/server/enroll</text>
    <text x="54" y="156" class="p">返回 server_id</text>
    <rect x="34" y="246" width="226" height="92" rx="12" fill="#ffffff"/>
    <text x="54" y="282" class="code">/server</text>
    <text x="54" y="310" class="p">WebSocket 长连接</text>
  </g>
  <path d="M370 266 H836" fill="none" stroke="#31546c" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="604" y="244" text-anchor="middle" class="p">POST enroll：机器名称、版本、安装 ID、账号鉴权</text>
  <path d="M836 354 H370" fill="none" stroke="#31546c" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="604" y="334" text-anchor="middle" class="p">返回 server_id / environment_id</text>
  <path d="M370 474 H836" fill="none" stroke="#31546c" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
  <text x="604" y="452" text-anchor="middle" class="p">WSS 建连：server_id、protocol_version、account_id、cursor</text>
  <g transform="translate(436 546)">
    <rect width="328" height="78" rx="14" fill="#fff8e8" stroke="#b7791f" stroke-width="2"/>
    <text x="164" y="32" text-anchor="middle" class="h">断线恢复</text>
    <text x="164" y="58" text-anchor="middle" class="p">重连时携带 subscribe cursor 与未 ack 缓存</text>
  </g>
</svg>
