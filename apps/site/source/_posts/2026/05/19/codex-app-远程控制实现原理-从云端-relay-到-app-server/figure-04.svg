<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">远端消息映射成本地 App Server 连接</title>
  <desc id="desc">展示 client envelope 通过 ClientTracker 变成本地 TransportEvent 再进入 MessageProcessor</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31546c"/>
    </marker>
    <style>
      .title{font:700 34px Arial,'PingFang SC',sans-serif;fill:#1f2933}
      .sub{font:18px Arial,'PingFang SC',sans-serif;fill:#52606d}
      .h{font:700 22px Arial,'PingFang SC',sans-serif;fill:#243b53}
      .p{font:16px Arial,'PingFang SC',sans-serif;fill:#486581}
      .code{font:15px Menlo,Consolas,monospace;fill:#334e68}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f6f8f5"/>
  <text x="70" y="70" class="title">ClientTracker：远端 stream 变成本机 JSON-RPC 连接</text>
  <text x="72" y="106" class="sub">手机端的消息不是直接执行，而是先被映射成 App Server 的普通连接。</text>
  <g transform="translate(62 178)">
    <rect width="220" height="138" rx="16" fill="#e7eef8" stroke="#486581" stroke-width="3"/>
    <text x="110" y="44" text-anchor="middle" class="h">ClientEnvelope</text>
    <text x="36" y="78" class="code">client_id</text>
    <text x="36" y="104" class="code">stream_id</text>
    <text x="36" y="130" class="code">ClientMessage</text>
  </g>
  <g transform="translate(378 178)">
    <rect width="236" height="138" rx="16" fill="#fff8e8" stroke="#b7791f" stroke-width="3"/>
    <text x="118" y="44" text-anchor="middle" class="h">ClientTracker</text>
    <text x="38" y="82" class="p">分配 connection_id</text>
    <text x="38" y="112" class="p">维护 idle timeout</text>
  </g>
  <g transform="translate(718 178)">
    <rect width="232" height="138" rx="16" fill="#dff3e8" stroke="#2f855a" stroke-width="3"/>
    <text x="116" y="44" text-anchor="middle" class="h">TransportEvent</text>
    <text x="34" y="82" class="code">ConnectionOpened</text>
    <text x="34" y="112" class="code">IncomingMessage</text>
  </g>
  <g transform="translate(476 430)">
    <rect width="288" height="154" rx="16" fill="#eef2f7" stroke="#627d98" stroke-width="3"/>
    <text x="144" y="46" text-anchor="middle" class="h">MessageProcessor</text>
    <text x="42" y="84" class="p">initialize</text>
    <text x="42" y="112" class="p">thread/start</text>
    <text x="42" y="140" class="p">turn/start</text>
  </g>
  <g transform="translate(878 430)">
    <rect width="250" height="154" rx="16" fill="#f0f5f4" stroke="#557c7b" stroke-width="3"/>
    <text x="125" y="46" text-anchor="middle" class="h">Codex Core</text>
    <text x="44" y="84" class="p">工具调用</text>
    <text x="44" y="112" class="p">审批 / 沙箱</text>
    <text x="44" y="140" class="p">事件落盘</text>
  </g>
  <path d="M282 247 H378" fill="none" stroke="#31546c" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M614 247 H718" fill="none" stroke="#31546c" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M834 316 C832 392 764 440 764 500" fill="none" stroke="#31546c" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M764 508 H878" fill="none" stroke="#31546c" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M878 550 C690 680 294 650 180 318" fill="none" stroke="#8a6f3d" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <text x="330" y="228" class="p">按 stream 建连接</text>
  <text x="632" y="228" class="p">送入 App Server</text>
  <text x="788" y="390" class="p">普通 JSON-RPC 请求</text>
  <text x="446" y="656" class="p">item/started、diff、终端输出、turn/completed 再回到远端</text>
</svg>
