<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Codex 会话分享工具实现解析封面</title>
  <desc id="desc">本地 Agent 会话被整理成只读 Snapshot 的技术文章封面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4efe7"/>
      <stop offset="48%" stop-color="#e9f4f1"/>
      <stop offset="100%" stop-color="#eef1fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#172033" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#266071"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <path d="M0 96H1200M0 192H1200M0 288H1200M0 384H1200M0 480H1200M0 576H1200M0 672H1200" stroke="#172033" stroke-opacity="0.055"/>
  <path d="M96 0V760M192 0V760M288 0V760M384 0V760M480 0V760M576 0V760M672 0V760M768 0V760M864 0V760M960 0V760M1056 0V760" stroke="#172033" stroke-opacity="0.045"/>
  <rect x="62" y="58" width="1076" height="644" rx="32" fill="#fffdf8" opacity="0.82" filter="url(#shadow)"/>
  <text x="104" y="148" font-family="Arial, 'PingFang SC', sans-serif" font-size="58" font-weight="800" fill="#121722">Codex 会话分享工具实现解析</text>
  <text x="108" y="202" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" fill="#596574">把本地 Agent 历史做成只读 Snapshot</text>
  <g transform="translate(105 302)">
    <rect x="0" y="0" width="258" height="220" rx="22" fill="#15202e"/>
    <text x="32" y="58" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700" fill="#8bd3c7">local</text>
    <text x="32" y="104" font-family="Arial, 'PingFang SC', sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Codex / Claude / Trae</text>
    <text x="32" y="146" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#b9c2cf">JSONL、history、recorder</text>
    <text x="32" y="180" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#b9c2cf">只读扫描，不写回原文件</text>
  </g>
  <g transform="translate(466 290)">
    <rect x="0" y="0" width="268" height="244" rx="24" fill="#edf8f4" stroke="#88c8bb" stroke-width="3"/>
    <text x="134" y="66" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" fill="#155e75">Snapshot</text>
    <text x="134" y="112" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#46616a">turns[]</text>
    <text x="134" y="148" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#46616a">Markdown + Highlight</text>
    <text x="134" y="184" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#46616a">redact + export</text>
  </g>
  <g transform="translate(836 302)">
    <rect x="0" y="0" width="248" height="220" rx="22" fill="#fff8e7" stroke="#d8ad5f" stroke-width="3"/>
    <text x="124" y="68" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" fill="#7a4d12">Read-only</text>
    <text x="124" y="112" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#6c5b45">HTML / Markdown</text>
    <text x="124" y="150" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#6c5b45">朋友只能阅读</text>
    <text x="124" y="188" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#6c5b45">不能继续操作</text>
  </g>
  <path d="M372 412H454" stroke="#266071" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M744 412H824" stroke="#266071" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="318" y="604" width="564" height="48" rx="24" fill="#ffffff" stroke="#ced7df"/>
  <text x="600" y="635" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700" fill="#364152">核心不是公开 thread，而是冻结一份可审阅的静态快照</text>
</svg>
