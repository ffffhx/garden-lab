<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Snapshot 的产品边界</title>
  <desc id="desc">原始 thread、只读 snapshot 和朋友阅读页面之间的边界对比</desc>
  <rect width="1200" height="760" fill="#f5f1e8"/>
  <text x="72" y="92" font-family="Arial, 'PingFang SC', sans-serif" font-size="38" font-weight="800" fill="#16191f">Snapshot 的产品边界</text>
  <text x="72" y="132" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#667085">冻结、审阅、导出，而不是把仍然活着的 thread 交出去</text>
  <g transform="translate(76 210)">
    <rect width="300" height="360" rx="22" fill="#172033"/>
    <text x="34" y="64" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" fill="#ffffff">原始 Thread</text>
    <text x="34" y="118" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#cbd5e1">系统 / 开发者上下文</text>
    <text x="34" y="160" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#cbd5e1">工具调用和输出</text>
    <text x="34" y="202" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#cbd5e1">本地路径和截图</text>
    <text x="34" y="244" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#cbd5e1">可能继续执行</text>
    <text x="34" y="306" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#fca5a5">不适合直接公开</text>
  </g>
  <g transform="translate(450 210)">
    <rect width="300" height="360" rx="22" fill="#e9f8f3" stroke="#76b7a8" stroke-width="3"/>
    <text x="34" y="64" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" fill="#155e75">只读 Snapshot</text>
    <text x="34" y="118" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#335b62">用户 / assistant 正文</text>
    <text x="34" y="160" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#335b62">Markdown 和代码高亮</text>
    <text x="34" y="202" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#335b62">图片附件</text>
    <text x="34" y="244" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#335b62">默认脱敏</text>
    <text x="34" y="306" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f766e">可先本地审阅</text>
  </g>
  <g transform="translate(824 210)">
    <rect width="300" height="360" rx="22" fill="#fff8e7" stroke="#d5a850" stroke-width="3"/>
    <text x="34" y="64" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" fill="#7a4d12">朋友看到</text>
    <text x="34" y="118" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#604c2e">静态 HTML / Markdown</text>
    <text x="34" y="160" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#604c2e">不能继续对话</text>
    <text x="34" y="202" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#604c2e">不能执行命令</text>
    <text x="34" y="244" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#604c2e">不能读取本机环境</text>
    <text x="34" y="306" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#9a5b00">只负责阅读</text>
  </g>
  <path d="M388 390H438" stroke="#2f6f7e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M762 390H812" stroke="#2f6f7e" stroke-width="5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2f6f7e"/>
    </marker>
  </defs>
</svg>
