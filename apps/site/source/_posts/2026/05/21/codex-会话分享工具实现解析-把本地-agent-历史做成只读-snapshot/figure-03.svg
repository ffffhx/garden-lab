<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Trae 本地 Recorder 链路</title>
  <desc id="desc">Trae 页面通过 fetch、WebSocket、EventSource 和 DOM 捕获消息并保存为本地 JSONL</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#266071"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f5f1e8"/>
  <text x="72" y="90" font-family="Arial, 'PingFang SC', sans-serif" font-size="38" font-weight="800" fill="#16191f">Trae 本地 Recorder 链路</text>
  <text x="72" y="130" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#667085">当本地存储不保存完整 transcript 时，只能在当前页面显式捕获</text>
  <g transform="translate(76 218)">
    <rect width="292" height="300" rx="26" fill="#16191f"/>
    <text x="34" y="58" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" fill="#fff">Trae 页面</text>
    <text x="34" y="112" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#cbd5e1">fetch request / response</text>
    <text x="34" y="154" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#cbd5e1">WebSocket send / message</text>
    <text x="34" y="196" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#cbd5e1">EventSource message</text>
    <text x="34" y="238" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#cbd5e1">DOM message fallback</text>
  </g>
  <g transform="translate(470 214)">
    <rect width="260" height="308" rx="26" fill="#e9f8f3" stroke="#83c5b7" stroke-width="3"/>
    <text x="130" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" fill="#155e75">Recorder</text>
    <text x="130" y="112" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#335b62">提取 session id</text>
    <text x="130" y="154" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#335b62">合并 stream chunk</text>
    <text x="130" y="196" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#335b62">去重 user / assistant</text>
    <text x="130" y="238" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#335b62">修复被拆平代码块</text>
    <text x="130" y="280" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#335b62">默认不保存 headers</text>
  </g>
  <g transform="translate(842 230)">
    <rect width="282" height="276" rx="24" fill="#fff8e7" stroke="#d5a850" stroke-width="3"/>
    <text x="141" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" fill="#7a4d12">本地 JSONL</text>
    <text x="141" y="112" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#604c2e">~/.codex-snapshot</text>
    <text x="141" y="150" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#604c2e">trae-recordings</text>
    <text x="141" y="202" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#604c2e">conversation id</text>
    <text x="141" y="240" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#604c2e">作为文件 id</text>
  </g>
  <path d="M380 368H458" stroke="#266071" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M742 368H830" stroke="#266071" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="216" y="612" width="768" height="52" rx="26" fill="#ffffff" stroke="#cfd8df"/>
  <text x="600" y="645" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#364152">Recorder 是显式注入的本地捕获层，只记录注入之后的 Trae 页面活动</text>
</svg>
