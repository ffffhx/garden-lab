<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Snapshot Viewer 页面结构</title>
  <desc id="desc">左侧项目列表、右侧只读会话内容和可拖拽分栏的页面结构</desc>
  <rect width="1200" height="760" fill="#f4f0e7"/>
  <text x="72" y="90" font-family="Arial, 'PingFang SC', sans-serif" font-size="38" font-weight="800" fill="#16191f">Snapshot Viewer 页面结构</text>
  <text x="72" y="130" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#667085">左侧按来源和项目组织，右侧保留 Codex 风格的阅读体验</text>
  <g transform="translate(72 188)">
    <rect width="1056" height="492" rx="26" fill="#fffdf8" stroke="#cfd8df" stroke-width="3"/>
    <rect x="0" y="0" width="330" height="492" rx="26" fill="#f8f4eb"/>
    <line x1="340" y1="0" x2="340" y2="492" stroke="#16191f" stroke-width="4"/>
    <rect x="34" y="36" width="112" height="24" rx="12" fill="#dceef2"/>
    <text x="90" y="53" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" fill="#1d5f78">CODEX</text>
    <rect x="156" y="36" width="112" height="24" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <text x="212" y="53" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" fill="#667085">TRAE</text>
    <text x="34" y="100" font-family="ui-monospace, Menlo, monospace" font-size="25" font-weight="900" fill="#555">garden-lab</text>
    <rect x="54" y="126" width="236" height="42" rx="10" fill="#e8e2d6"/>
    <text x="74" y="154" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" fill="#16191f">了解会话分享</text>
    <text x="54" y="214" font-family="ui-monospace, Menlo, monospace" font-size="25" font-weight="900" fill="#555">coze-monorepo</text>
    <text x="74" y="266" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" fill="#16191f">排查缺陷原因</text>
    <text x="74" y="318" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" fill="#16191f">删除 highlightRow</text>
    <text x="74" y="370" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" fill="#16191f">替换网站图片</text>
    <rect x="382" y="34" width="620" height="56" rx="4" fill="#fffdf8" stroke="#d0d7de"/>
    <text x="410" y="68" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="800" fill="#667085">Read-only review / redacted</text>
    <rect x="720" y="132" width="278" height="72" rx="20" fill="#eef9f6" stroke="#cde7e2"/>
    <text x="859" y="176" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" fill="#16191f">用户问题靠右</text>
    <text x="390" y="268" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" fill="#16191f">assistant 回复靠左，正文直接渲染 Markdown。</text>
    <rect x="390" y="318" width="370" height="88" rx="12" fill="#111722"/>
    <text x="414" y="354" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#8ab4f8">const</text>
    <text x="472" y="354" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#edf4ff">snapshot = renderMarkdown(turn)</text>
    <text x="414" y="386" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#7d8796">// 代码块带语法高亮</text>
    <rect x="500" y="454" width="180" height="20" rx="10" fill="#cfd8df"/>
    <text x="590" y="469" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" fill="#475467">drag splitter</text>
  </g>
</svg>
