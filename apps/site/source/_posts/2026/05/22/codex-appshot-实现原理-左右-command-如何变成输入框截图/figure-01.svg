<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Appshot 总体链路</title>
  <desc id="desc">左右 Command 到 Codex composer attachment 的完整链路</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2d6f7c"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f5f1e8"/>
  <text x="74" y="90" font-family="Arial, 'PingFang SC', sans-serif" font-size="38" font-weight="800" fill="#16191f">Appshot 总体链路</text>
  <text x="74" y="130" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#667085">左右 Command 只是入口，截图和附件是后续多层协作的结果</text>
  <g transform="translate(74 214)">
    <rect width="190" height="190" rx="24" fill="#172033"/>
    <text x="95" y="70" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="42" font-weight="800" fill="#ffffff">⌘⌘</text>
    <text x="95" y="118" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" fill="#ffffff">左右 Command</text>
    <text x="95" y="152" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#b9c2cf">DoubleCommand</text>
  </g>
  <g transform="translate(330 214)">
    <rect width="220" height="190" rx="24" fill="#e8f8f3" stroke="#76b7a8" stroke-width="3"/>
    <text x="110" y="62" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="25" font-weight="800" fill="#155e75">原生监听器</text>
    <text x="110" y="106" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#335b62">flagsChanged</text>
    <text x="110" y="144" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#335b62">stdout: down</text>
  </g>
  <g transform="translate(616 214)">
    <rect width="220" height="190" rx="24" fill="#eef1fb" stroke="#8d9ed0" stroke-width="3"/>
    <text x="110" y="62" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="25" font-weight="800" fill="#243a73">Electron main</text>
    <text x="110" y="106" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#3c4d79">聚焦窗口</text>
    <text x="110" y="144" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#3c4d79">appshot-shortcut</text>
  </g>
  <g transform="translate(902 214)">
    <rect width="220" height="190" rx="24" fill="#fff8e7" stroke="#d5a850" stroke-width="3"/>
    <text x="110" y="62" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="25" font-weight="800" fill="#7a4d12">Renderer</text>
    <text x="110" y="106" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#604c2e">启动捕获</text>
    <text x="110" y="144" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#604c2e">更新输入框附件</text>
  </g>
  <path d="M276 310H318" stroke="#2d6f7c" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M562 310H604" stroke="#2d6f7c" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M848 310H890" stroke="#2d6f7c" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(188 492)">
    <rect width="824" height="130" rx="24" fill="#ffffff" stroke="#ced7df"/>
    <text x="36" y="54" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" fill="#172033">捕获支线</text>
    <text x="36" y="94" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#536170">Renderer → Main IPC → Worker → Apple Events → Codex Computer Use → ScreenCaptureKit / Accessibility</text>
  </g>
  <path d="M1012 404C1012 450 924 454 924 492" stroke="#2d6f7c" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="684" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#334155">主线负责触发和 UI，支线负责真正的屏幕与辅助功能采集</text>
</svg>
