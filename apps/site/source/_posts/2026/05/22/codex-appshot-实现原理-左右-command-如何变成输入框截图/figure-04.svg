<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Appshot 的权限与开关</title>
  <desc id="desc">Codex Appshot 功能需要的开关、输入监听、屏幕录制和辅助功能权限</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2d6f7c"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f6f3eb"/>
  <text x="72" y="88" font-family="Arial, 'PingFang SC', sans-serif" font-size="38" font-weight="800" fill="#16191f">Appshot 的权限与开关</text>
  <text x="72" y="128" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#667085">功能开关打开以后，系统权限仍然决定它能不能真正捕获屏幕</text>
  <g transform="translate(96 216)">
    <rect width="240" height="280" rx="24" fill="#eef1fb" stroke="#8d9ed0" stroke-width="3"/>
    <text x="120" y="62" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="800" fill="#243a73">功能开关</text>
    <text x="120" y="118" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#3c4d79">appshotsEnabled</text>
    <text x="120" y="166" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#3c4d79">启停后台服务</text>
    <text x="120" y="208" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#3c4d79">控制入口可用性</text>
  </g>
  <g transform="translate(390 216)">
    <rect width="240" height="280" rx="24" fill="#e8f8f3" stroke="#76b7a8" stroke-width="3"/>
    <text x="120" y="62" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="800" fill="#155e75">输入事件</text>
    <text x="120" y="118" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#335b62">全局修饰键监听</text>
    <text x="120" y="166" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#335b62">ready / down / up</text>
    <text x="120" y="208" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#335b62">失败时提示权限</text>
  </g>
  <g transform="translate(684 216)">
    <rect width="240" height="280" rx="24" fill="#fff8e7" stroke="#d5a850" stroke-width="3"/>
    <text x="120" y="62" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="800" fill="#7a4d12">屏幕录制</text>
    <text x="120" y="118" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#604c2e">ScreenCaptureKit</text>
    <text x="120" y="166" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#604c2e">读取窗口截图</text>
    <text x="120" y="208" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#604c2e">写入临时图片</text>
  </g>
  <g transform="translate(978 216)">
    <rect width="150" height="280" rx="24" fill="#172033"/>
    <text x="75" y="62" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="800" fill="#ffffff">辅助功能</text>
    <text x="75" y="126" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#cbd5e1">AX Text</text>
    <text x="75" y="174" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#cbd5e1">UI 语义</text>
    <text x="75" y="222" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#cbd5e1">前台窗口</text>
  </g>
  <path d="M348 356H378" stroke="#2d6f7c" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M642 356H672" stroke="#2d6f7c" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M936 356H966" stroke="#2d6f7c" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="214" y="604" width="772" height="58" rx="29" fill="#ffffff" stroke="#ced7df"/>
  <text x="600" y="640" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#334155">任一环节不可用，用户看到的结果都可能是“不触发”或“无法捕获”</text>
</svg>
