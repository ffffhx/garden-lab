<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Codex Snapshots 实现原理封面</title>
  <desc id="desc">从本地会话到云端只读快照的架构示意封面</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#d9ded7" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#18212b" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#f5f1e8"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.8"/>
  <rect x="70" y="58" width="1060" height="514" rx="18" fill="#fffdf8" stroke="#17202a" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="128" fill="#2f6fbb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800">CODEX SNAPSHOTS</text>
  <text x="110" y="210" fill="#17202a" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="58" font-weight="900">从本地会话到云端只读快照</text>
  <text x="112" y="260" fill="#617181" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="600">扫描、归一、脱敏、审阅、发布：一条有边界的 Agent 会话分享链路</text>
  <g transform="translate(120 350)">
    <rect x="0" y="0" width="255" height="110" rx="14" fill="#eef9f6" stroke="#0f766e" stroke-width="2"/>
    <text x="28" y="42" fill="#0f4f48" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="850">本地历史</text>
    <text x="28" y="76" fill="#37645e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Codex / Claude / Trae</text>
  </g>
  <path d="M405 405 H500" stroke="#17202a" stroke-width="4" stroke-linecap="round"/>
  <path d="M500 405 l-14 -10 v20 z" fill="#17202a"/>
  <g transform="translate(530 350)">
    <rect x="0" y="0" width="255" height="110" rx="14" fill="#fff8df" stroke="#b7791f" stroke-width="2"/>
    <text x="28" y="42" fill="#7a4b0b" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="850">隐私闸门</text>
    <text x="28" y="76" fill="#7f642a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">risk / redact / sanitize</text>
  </g>
  <path d="M815 405 H910" stroke="#17202a" stroke-width="4" stroke-linecap="round"/>
  <path d="M910 405 l-14 -10 v20 z" fill="#17202a"/>
  <g transform="translate(940 350)">
    <rect x="0" y="0" width="150" height="110" rx="14" fill="#edf4ff" stroke="#2f6fbb" stroke-width="2"/>
    <text x="25" y="42" fill="#245d83" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="850">只读分享</text>
    <text x="25" y="76" fill="#416f95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">share API</text>
  </g>
  <text x="110" y="528" fill="#17202a" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="650">观察 commit：acb51b3cef05728a96184f7d1fa886c7cb4a3a8c</text>
