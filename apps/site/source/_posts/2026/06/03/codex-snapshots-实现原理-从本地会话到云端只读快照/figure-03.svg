<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">快照构建和隐私处理</title>
  <desc id="desc">从原始记录到统一 turns 的过滤、风险检测、脱敏和 HTML 净化流程</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#17202a"/>
    </marker>
    <style>
      .title { font: 900 32px "Inter", "PingFang SC", sans-serif; fill: #17202a; }
      .sub { font: 600 17px "Inter", "PingFang SC", sans-serif; fill: #617181; }
      .step { font: 850 19px "Inter", "PingFang SC", sans-serif; fill: #17202a; }
      .small { font: 600 14px "Inter", "PingFang SC", sans-serif; fill: #4f5e6d; }
      .mono { font: 700 12px "SFMono-Regular", Menlo, monospace; fill: #245d83; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f6f8f5"/>
  <text x="70" y="70" class="title">快照构建：从原始历史到安全可读的 turns</text>
  <text x="72" y="102" class="sub">先筛出可读正文，再在原文上标风险，最后渲染成受限 HTML。</text>
  <g transform="translate(70 180)">
    <rect width="170" height="130" rx="10" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/>
    <text x="22" y="42" class="step">读取原始行</text>
    <text x="22" y="76" class="small">JSONL / history</text>
    <text x="22" y="102" class="mono">readJsonl()</text>
  </g>
  <g transform="translate(285 180)">
    <rect width="170" height="130" rx="10" fill="#edf4ff" stroke="#2f6fbb" stroke-width="2"/>
    <text x="22" y="42" class="step">过滤角色</text>
    <text x="22" y="76" class="small">user / assistant</text>
    <text x="22" y="102" class="mono">skip bootstrap</text>
  </g>
  <g transform="translate(500 180)">
    <rect width="170" height="130" rx="10" fill="#fff8df" stroke="#b7791f" stroke-width="2"/>
    <text x="22" y="42" class="step">标记风险</text>
    <text x="22" y="76" class="small">基于原文检测</text>
    <text x="22" y="102" class="mono">addRisks()</text>
  </g>
  <g transform="translate(715 180)">
    <rect width="170" height="130" rx="10" fill="#eef9f6" stroke="#0f766e" stroke-width="2"/>
    <text x="22" y="42" class="step">脱敏文本</text>
    <text x="22" y="76" class="small">token / path</text>
    <text x="22" y="102" class="mono">redactText()</text>
  </g>
  <g transform="translate(930 180)">
    <rect width="170" height="130" rx="10" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/>
    <text x="22" y="42" class="step">渲染 HTML</text>
    <text x="22" y="76" class="small">Markdown + 高亮</text>
    <text x="22" y="102" class="mono">sanitize-html</text>
  </g>
  <path d="M240 245 H273" stroke="#17202a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M455 245 H488" stroke="#17202a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M670 245 H703" stroke="#17202a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M885 245 H918" stroke="#17202a" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(115 430)">
    <rect width="300" height="150" rx="12" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/>
    <text x="28" y="44" class="step">默认正文边界</text>
    <text x="28" y="80" class="small">隐藏 system / developer</text>
    <text x="28" y="112" class="small">隐藏工具调用和工具输出</text>
  </g>
  <g transform="translate(450 430)">
    <rect width="300" height="150" rx="12" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/>
    <text x="28" y="44" class="step">风险面板</text>
    <text x="28" y="80" class="small">私钥、JWT、Bearer、API key</text>
    <text x="28" y="112" class="small">本机 home path、内部域名</text>
  </g>
  <g transform="translate(785 430)">
    <rect width="300" height="150" rx="12" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/>
    <text x="28" y="44" class="step">统一输出</text>
    <text x="28" y="80" class="small">snapshot.turns[]</text>
    <text x="28" y="112" class="small">HTML / Markdown / Share API 共用</text>
  </g>
  <text x="70" y="690" class="sub">风险检测先于脱敏，渲染后还要净化：每层都假设上一层可能漏掉东西。</text>
</svg>
