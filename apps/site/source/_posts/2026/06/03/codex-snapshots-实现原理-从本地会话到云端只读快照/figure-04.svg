<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">本地 Viewer 安全边界</title>
  <desc id="desc">浏览器、本地 Node 服务、本机历史文件和分享 API 之间的访问边界</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#17202a"/>
    </marker>
    <style>
      .title { font: 900 32px "Inter", "PingFang SC", sans-serif; fill: #17202a; }
      .sub { font: 600 17px "Inter", "PingFang SC", sans-serif; fill: #617181; }
      .box-title { font: 850 22px "Inter", "PingFang SC", sans-serif; fill: #17202a; }
      .box-text { font: 600 15px "Inter", "PingFang SC", sans-serif; fill: #4f5e6d; }
      .mono { font: 700 13px "SFMono-Regular", Menlo, monospace; fill: #245d83; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f5f1e8"/>
  <text x="70" y="70" class="title">本地 Viewer：浏览器不直接读文件，只访问回环服务</text>
  <text x="72" y="102" class="sub">Node 服务负责扫描本机历史；页面只通过受控 API 审阅和导出。</text>
  <g transform="translate(85 210)">
    <rect width="260" height="170" rx="12" fill="#edf4ff" stroke="#2f6fbb" stroke-width="2"/>
    <text x="28" y="50" class="box-title">浏览器 UI</text>
    <text x="28" y="88" class="box-text">搜索、切换来源</text>
    <text x="28" y="120" class="box-text">工具 / 输出 / 脱敏开关</text>
    <text x="28" y="148" class="mono">GET API only by default</text>
  </g>
  <g transform="translate(465 190)">
    <rect width="290" height="210" rx="12" fill="#ffffff" stroke="#17202a" stroke-width="2"/>
    <text x="30" y="50" class="box-title">本地 Node 服务</text>
    <text x="30" y="86" class="mono">127.0.0.1:4321</text>
    <text x="30" y="120" class="box-text">/api/sessions</text>
    <text x="30" y="150" class="box-text">/api/snapshot</text>
    <text x="30" y="180" class="box-text">/export / publish</text>
  </g>
  <g transform="translate(870 120)">
    <rect width="250" height="150" rx="12" fill="#eef9f6" stroke="#0f766e" stroke-width="2"/>
    <text x="26" y="46" class="box-title">本机历史文件</text>
    <text x="26" y="82" class="box-text">~/.codex</text>
    <text x="26" y="112" class="box-text">~/.claude</text>
    <text x="26" y="136" class="box-text">~/.trae-cn</text>
  </g>
  <g transform="translate(870 420)">
    <rect width="250" height="150" rx="12" fill="#fff8df" stroke="#b7791f" stroke-width="2"/>
    <text x="26" y="46" class="box-title">写动作保护</text>
    <text x="26" y="82" class="box-text">Origin 白名单</text>
    <text x="26" y="112" class="box-text">CSRF token</text>
    <text x="26" y="136" class="box-text">发布必须脱敏</text>
  </g>
  <path d="M345 295 H453" stroke="#17202a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="366" y="276" class="mono">fetch</text>
  <path d="M755 250 C805 222 815 205 858 198" stroke="#17202a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="774" y="222" class="mono">Node 读文件</text>
  <path d="M755 330 C805 376 815 480 858 496" stroke="#17202a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="774" y="414" class="mono">POST mutation</text>
  <path d="M460 520 H245 C180 520 165 420 210 390" stroke="#a33a2b" stroke-width="3" stroke-dasharray="8 8" fill="none"/>
  <text x="190" y="555" fill="#a33a2b" font-family="Inter, PingFang SC, sans-serif" font-size="18" font-weight="800">浏览器不能直接扫描本机历史目录</text>
  <text x="70" y="690" class="sub">本地常驻服务的安全关键：只监听回环地址，读写分开，写动作必须有来源和 token。</text>
</svg>
