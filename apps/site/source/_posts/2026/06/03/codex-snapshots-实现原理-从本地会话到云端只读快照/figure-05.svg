<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">云端 Share API 发布链路</title>
  <desc id="desc">从本地发布脱敏快照到 Share API 存储和公网只读读取的流程</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#17202a"/>
    </marker>
    <style>
      .title { font: 900 32px "Inter", "PingFang SC", sans-serif; fill: #17202a; }
      .sub { font: 600 17px "Inter", "PingFang SC", sans-serif; fill: #617181; }
      .box-title { font: 850 20px "Inter", "PingFang SC", sans-serif; fill: #17202a; }
      .box-text { font: 600 14px "Inter", "PingFang SC", sans-serif; fill: #4f5e6d; }
      .mono { font: 700 12px "SFMono-Regular", Menlo, monospace; fill: #245d83; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f6f8f5"/>
  <text x="70" y="70" class="title">云端分享：Share API 只保存已脱敏的只读 payload</text>
  <text x="72" y="102" class="sub">公网服务不读取用户电脑，只负责认证、净化、存储和只读分发。</text>
  <g transform="translate(70 190)">
    <rect width="185" height="145" rx="12" fill="#edf4ff" stroke="#2f6fbb" stroke-width="2"/>
    <text x="24" y="44" class="box-title">本地发布</text>
    <text x="24" y="78" class="box-text">Viewer / CLI</text>
    <text x="24" y="108" class="mono">redact = true</text>
  </g>
  <g transform="translate(320 190)">
    <rect width="185" height="145" rx="12" fill="#fff8df" stroke="#b7791f" stroke-width="2"/>
    <text x="24" y="44" class="box-title">Payload Gate</text>
    <text x="24" y="78" class="box-text">删除 cwd / filePath</text>
    <text x="24" y="108" class="box-text">拒绝未脱敏</text>
  </g>
  <g transform="translate(570 190)">
    <rect width="185" height="145" rx="12" fill="#eef9f6" stroke="#0f766e" stroke-width="2"/>
    <text x="24" y="44" class="box-title">Share API</text>
    <text x="24" y="78" class="box-text">token 或 GitHub OAuth</text>
    <text x="24" y="108" class="box-text">再次 sanitize HTML</text>
  </g>
  <g transform="translate(820 190)">
    <rect width="185" height="145" rx="12" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/>
    <text x="24" y="44" class="box-title">Share Store</text>
    <text x="24" y="78" class="box-text">shares.json</text>
    <text x="24" y="108" class="box-text">串行写入 + rename</text>
  </g>
  <path d="M255 262 H308" stroke="#17202a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M505 262 H558" stroke="#17202a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M755 262 H808" stroke="#17202a" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(160 470)">
    <rect width="250" height="135" rx="12" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/>
    <text x="26" y="44" class="box-title">公开列表</text>
    <text x="26" y="78" class="box-text">只返回摘要</text>
    <text x="26" y="106" class="mono">GET /api/snapshots</text>
  </g>
  <g transform="translate(475 470)">
    <rect width="250" height="135" rx="12" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/>
    <text x="26" y="44" class="box-title">分享详情</text>
    <text x="26" y="78" class="box-text">返回只读 snapshot</text>
    <text x="26" y="106" class="mono">GET /api/snapshots/:id</text>
  </g>
  <g transform="translate(790 470)">
    <rect width="250" height="135" rx="12" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/>
    <text x="26" y="44" class="box-title">删除权限</text>
    <text x="26" y="78" class="box-text">站长或发布者</text>
    <text x="26" y="106" class="mono">DELETE /api/snapshots/:id</text>
  </g>
  <path d="M912 335 C850 425 320 392 285 458" stroke="#17202a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M912 335 C875 422 615 395 600 458" stroke="#17202a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M912 335 C930 400 925 430 915 458" stroke="#17202a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="70" y="690" class="sub">云端边界：认证决定谁能写，payload 规则决定写进去的东西是否仍是安全的只读快照。</text>
</svg>
