<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Coze 测试账号切换插件实现原理封面</title>
  <desc id="desc">从 Chrome popup 到 CloudIdentity 和 Coze Passport API 的账号切换链路</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f766e" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#fbfaf6" />
  <rect x="44" y="42" width="1112" height="546" rx="30" fill="#ffffff" stroke="#d6d3d1" />
  <rect x="84" y="82" width="1032" height="118" rx="22" fill="#102a2a" />
  <text x="124" y="132" fill="#99f6e4" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">Coze Test Account Switcher</text>
  <text x="124" y="174" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="41" font-weight="800">从 Popup 到 Passport API 的切换链路</text>
  <g filter="url(#shadow)">
    <rect x="94" y="262" width="184" height="164" rx="18" fill="#ecfeff" stroke="#67e8f9" />
    <text x="126" y="310" fill="#155e75" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="800">Popup</text>
    <text x="126" y="348" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">JWT / 权益</text>
    <text x="126" y="378" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">角色 / 进度</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="352" y="262" width="184" height="164" rx="18" fill="#f0fdf4" stroke="#86efac" />
    <text x="384" y="310" fill="#166534" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="800">后台状态机</text>
    <text x="384" y="348" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">查账号 / 跳过</text>
    <text x="384" y="378" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">退出 / 登录</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="262" width="184" height="164" rx="18" fill="#fff7ed" stroke="#fdba74" />
    <text x="642" y="310" fill="#9a3412" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="800">CloudIdentity</text>
    <text x="642" y="348" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">密码登录</text>
    <text x="642" y="378" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">Auth Code</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="868" y="262" width="238" height="164" rx="18" fill="#fef2f2" stroke="#fca5a5" />
    <text x="902" y="310" fill="#991b1b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="800">Coze Passport</text>
    <text x="902" y="348" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">写入登录态</text>
    <text x="902" y="378" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">订阅权益验权</text>
  </g>
  <path d="M282 344 H344" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M540 344 H602" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M798 344 H860" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="102" y="480" width="996" height="52" rx="16" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="138" y="514" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">核心原则：不用页面点击猜结果，用后台接口登录，再用 Coze API 证明账号、权益和角色。</text>
</svg>
