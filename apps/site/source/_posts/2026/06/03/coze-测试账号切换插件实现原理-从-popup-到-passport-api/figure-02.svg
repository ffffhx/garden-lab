<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Coze 测试账号切换状态机</title>
  <desc id="desc">从查询账号到退出登录、CloudIdentity 登录、Coze Passport 写入和最终验权的步骤</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#fbfaf7" />
  <text x="70" y="78" fill="#0f172a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="800">切换状态机：每一步都可记录、可跳过、可回补</text>
  <text x="70" y="114" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">状态机先证明当前不是目标，再退出旧账号并登录候选账号。</text>
  <g>
    <rect x="74" y="178" width="190" height="96" rx="18" fill="#ecfeff" stroke="#67e8f9" />
    <text x="116" y="216" fill="#155e75" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">query-account</text>
    <text x="112" y="248" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">按权益和角色查候选</text>
  </g>
  <g>
    <rect x="322" y="178" width="190" height="96" rx="18" fill="#f0fdf4" stroke="#86efac" />
    <text x="360" y="216" fill="#166534" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">acquire-tab</text>
    <text x="354" y="248" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">复用或打开 Coze</text>
  </g>
  <g>
    <rect x="570" y="178" width="190" height="96" rx="18" fill="#fff7ed" stroke="#fdba74" />
    <text x="604" y="216" fill="#9a3412" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">read-current</text>
    <text x="610" y="248" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">页面和 API 双读</text>
  </g>
  <g>
    <rect x="818" y="178" width="240" height="96" rx="18" fill="#fef2f2" stroke="#fca5a5" />
    <text x="868" y="216" fill="#991b1b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">already target?</text>
    <text x="864" y="248" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">若已匹配则直接收尾</text>
  </g>
  <path d="M266 226 H314" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M514 226 H562" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M762 226 H810" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <g>
    <rect x="104" y="396" width="196" height="100" rx="18" fill="#f8fafc" stroke="#94a3b8" />
    <text x="140" y="434" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">logout-api</text>
    <text x="134" y="466" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">退出当前 Coze 账号</text>
  </g>
  <g>
    <rect x="368" y="396" width="196" height="100" rx="18" fill="#fff7ed" stroke="#fdba74" />
    <text x="398" y="434" fill="#9a3412" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">signin-api</text>
    <text x="400" y="466" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">换取 auth code</text>
  </g>
  <g>
    <rect x="632" y="396" width="196" height="100" rx="18" fill="#ecfeff" stroke="#67e8f9" />
    <text x="654" y="434" fill="#155e75" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">passport-login</text>
    <text x="670" y="466" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">写入 Coze 登录态</text>
  </g>
  <g>
    <rect x="896" y="396" width="196" height="100" rx="18" fill="#f0fdf4" stroke="#86efac" />
    <text x="926" y="434" fill="#166534" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">verify-api</text>
    <text x="920" y="466" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">确认身份权益角色</text>
  </g>
  <path d="M938 276 C938 336 202 336 202 388" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  <path d="M302 446 H360" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M566 446 H624" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M830 446 H888" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="160" y="610" width="880" height="68" rx="20" fill="#0f172a" />
  <text x="204" y="642" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800">失败不是黑盒：额外验证、角色不符、企业待审批都会进入 skipped accounts。</text>
  <text x="204" y="668" fill="#bfdbfe" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">popup 展示的是后台 steps，所以用户能知道流程卡在哪里。</text>
</svg>
