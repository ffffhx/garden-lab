<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Coze Passport 接口登录链路</title>
  <desc id="desc">CSRF cookie、请求签名、logout 和 auth login 组成 Coze Passport 登录态写入</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#dc2626" />
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#fbfaf7" />
  <text x="70" y="78" fill="#0f172a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="800">Coze Passport：用接口退出旧账号，再写入新登录态</text>
  <text x="70" y="114" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">CloudIdentity auth code 还不是 Coze 登录态，需要 Passport 接口接住。</text>
  <g>
    <rect x="84" y="188" width="220" height="116" rx="18" fill="#f8fafc" stroke="#94a3b8" />
    <text x="122" y="232" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="800">读取 CSRF</text>
    <text x="116" y="266" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">passport_csrf_token</text>
  </g>
  <g>
    <rect x="364" y="188" width="220" height="116" rx="18" fill="#ecfeff" stroke="#67e8f9" />
    <text x="402" y="232" fill="#155e75" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="800">构造签名</text>
    <text x="396" y="266" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">query sign + aid sign</text>
  </g>
  <g>
    <rect x="644" y="188" width="220" height="116" rx="18" fill="#fff7ed" stroke="#fdba74" />
    <text x="694" y="232" fill="#9a3412" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="800">退出旧账号</text>
    <text x="696" y="266" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">need_redirect = 0</text>
  </g>
  <g>
    <rect x="924" y="188" width="220" height="116" rx="18" fill="#fef2f2" stroke="#fca5a5" />
    <text x="972" y="232" fill="#991b1b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="800">写入新账号</text>
    <text x="962" y="266" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">auth code + app id</text>
  </g>
  <path d="M306 246 H356" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M586 246 H636" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M866 246 H916" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="116" y="416" width="430" height="150" rx="24" fill="#ffffff" stroke="#cbd5e1" />
  <text x="154" y="466" fill="#0f172a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="800">签名保护了什么</text>
  <text x="154" y="512" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19">请求路径、公共参数、业务参数和时间戳</text>
  <text x="154" y="544" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19">GET 与 POST 的签名输入不同</text>
  <rect x="654" y="416" width="430" height="150" rx="24" fill="#ffffff" stroke="#cbd5e1" />
  <text x="692" y="466" fill="#0f172a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="800">为什么不用页面点击</text>
  <text x="692" y="512" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19">菜单和 DOM 容易变，接口步骤可测试</text>
  <text x="692" y="544" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19">退出和登录都能记录明确 step</text>
  <rect x="242" y="640" width="716" height="48" rx="16" fill="#0f172a" />
  <text x="284" y="671" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800">Passport login 成功后，还必须继续等 Coze API 验权通过。</text>
</svg>
