<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Open Token Board 实现原理封面</title>
  <desc id="desc">从本机 token 日志到朋友排行榜的系统链路封面图</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb" />
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#f8fafc" />
  <rect x="42" y="42" width="1116" height="546" rx="28" fill="#ffffff" stroke="#cbd5e1" />
  <rect x="80" y="82" width="1040" height="112" rx="20" fill="#0f172a" />
  <text x="116" y="132" fill="#bfdbfe" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">Open Token Board</text>
  <text x="116" y="170" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="42" font-weight="800">从本机 Token 日志到朋友排行榜</text>
  <g filter="url(#softShadow)">
    <rect x="92" y="246" width="190" height="180" rx="18" fill="#eff6ff" stroke="#93c5fd" />
    <text x="122" y="294" fill="#1e3a8a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800">本机日志</text>
    <text x="122" y="333" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">Codex / Claude</text>
    <text x="122" y="363" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">Cursor / Trae</text>
    <rect x="122" y="386" width="104" height="14" rx="7" fill="#2563eb" opacity="0.82" />
  </g>
  <g filter="url(#softShadow)">
    <rect x="368" y="246" width="190" height="180" rx="18" fill="#ecfdf5" stroke="#86efac" />
    <text x="398" y="294" fill="#14532d" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800">Agent</text>
    <text x="398" y="333" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">采集 / 差分</text>
    <text x="398" y="363" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">脱敏 / 去重</text>
    <rect x="398" y="386" width="118" height="14" rx="7" fill="#16a34a" opacity="0.82" />
  </g>
  <g filter="url(#softShadow)">
    <rect x="644" y="246" width="190" height="180" rx="18" fill="#fff7ed" stroke="#fdba74" />
    <text x="674" y="294" fill="#7c2d12" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800">API + 存储</text>
    <text x="674" y="333" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">GitHub 鉴权</text>
    <text x="674" y="363" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">PostgreSQL</text>
    <rect x="674" y="386" width="132" height="14" rx="7" fill="#f97316" opacity="0.82" />
  </g>
  <g filter="url(#softShadow)">
    <rect x="920" y="246" width="190" height="180" rx="18" fill="#fef2f2" stroke="#fca5a5" />
    <text x="950" y="294" fill="#7f1d1d" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800">排行榜</text>
    <text x="950" y="333" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">1D / 7D / 30D</text>
    <text x="950" y="363" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">Token / 费用</text>
    <rect x="950" y="386" width="96" height="14" rx="7" fill="#dc2626" opacity="0.82" />
  </g>
  <path d="M286 336 H350" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M562 336 H626" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M838 336 H902" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="92" y="478" width="1018" height="50" rx="16" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="126" y="510" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">统一事件模型 TokenUsageEvent：input + output 作为总消耗，cached input 作为效率副指标</text>
</svg>
