<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Open Token Board 五段链路</title>
  <desc id="desc">本机日志、agent、API、存储、前端排行榜之间的数据流</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#fbfaf7" />
  <text x="70" y="78" fill="#0f172a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="800">从本机日志到朋友排行榜的五段链路</text>
  <text x="70" y="114" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">采集端处理脏数据，服务端保证身份和幂等，前端只读真实 API。</text>
  <g>
    <rect x="70" y="178" width="188" height="220" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
    <text x="100" y="228" fill="#1e3a8a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="800">1. 本机来源</text>
    <text x="100" y="274" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">Codex JSONL</text>
    <text x="100" y="306" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">Claude history</text>
    <text x="100" y="338" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">Cursor SQLite</text>
    <text x="100" y="370" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">Trae 日志目录</text>
  </g>
  <g>
    <rect x="300" y="178" width="188" height="220" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2" />
    <text x="330" y="228" fill="#14532d" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="800">2. npx Agent</text>
    <text x="330" y="274" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">扫描文件</text>
    <text x="330" y="306" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">解析 token</text>
    <text x="330" y="338" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">Codex 差分</text>
    <text x="330" y="370" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">生成事件 id</text>
  </g>
  <g>
    <rect x="530" y="178" width="188" height="220" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2" />
    <text x="560" y="228" fill="#7c2d12" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="800">3. API 服务</text>
    <text x="560" y="274" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">验证 agent token</text>
    <text x="560" y="306" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">覆盖用户身份</text>
    <text x="560" y="338" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">二次清洗</text>
    <text x="560" y="370" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">返回 accepted</text>
  </g>
  <g>
    <rect x="760" y="178" width="188" height="220" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <text x="790" y="228" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="800">4. 存储层</text>
    <text x="790" y="274" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">PostgreSQL 优先</text>
    <text x="790" y="306" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">JSON 文件兜底</text>
    <text x="790" y="338" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">id 主键去重</text>
    <text x="790" y="370" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">replace 按用户清理</text>
  </g>
  <g>
    <rect x="990" y="178" width="140" height="220" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" />
    <text x="1018" y="228" fill="#7f1d1d" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="800">5. UI</text>
    <text x="1018" y="274" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">滚动窗口</text>
    <text x="1018" y="306" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">用户排名</text>
    <text x="1018" y="338" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">模型分布</text>
    <text x="1018" y="370" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">个人面板</text>
  </g>
  <path d="M260 288 H292" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M490 288 H522" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M720 288 H752" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M950 288 H982" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="70" y="476" width="1060" height="150" rx="20" fill="#ffffff" stroke="#cbd5e1" />
  <text x="104" y="526" fill="#0f172a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800">核心边界</text>
  <text x="104" y="570" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19">本机日志可以很脏，但 core 之后只看 TokenUsageEvent。</text>
  <text x="104" y="604" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19">前端不理解原始日志，也不展示 demo 榜单兜底。</text>
  <rect x="720" y="520" width="340" height="58" rx="14" fill="#eff6ff" stroke="#93c5fd" />
  <text x="750" y="556" fill="#1e40af" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800">统一事件 + 幂等写入 + 查询时聚合</text>
</svg>
