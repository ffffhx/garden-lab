<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">滚动窗口排行榜聚合</title>
  <desc id="desc">事件经过 normalize dedupe filter aggregate rank 生成排行榜 summary</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc" />
  <text x="70" y="78" fill="#0f172a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="800">排行榜聚合：查询时按滚动窗口计算</text>
  <text x="70" y="114" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">同一批事件可以按不同 range 和 metric 生成不同视角。</text>
  <rect x="90" y="176" width="1020" height="154" rx="24" fill="#ffffff" stroke="#cbd5e1" />
  <text x="128" y="226" fill="#0f172a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800">时间窗口</text>
  <line x1="250" y1="260" x2="1010" y2="260" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <rect x="322" y="232" width="244" height="56" rx="14" fill="#fee2e2" stroke="#fca5a5" />
  <text x="370" y="267" fill="#7f1d1d" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800">前一窗口：算 delta</text>
  <rect x="646" y="232" width="244" height="56" rx="14" fill="#dbeafe" stroke="#93c5fd" />
  <text x="700" y="267" fill="#1e3a8a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800">当前窗口：算排名</text>
  <text x="248" y="304" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15">previousStart</text>
  <text x="558" y="304" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15">start</text>
  <text x="892" y="304" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15">end / now</text>
  <g>
    <rect x="90" y="414" width="170" height="110" rx="18" fill="#eff6ff" stroke="#93c5fd" />
    <text x="118" y="458" fill="#1e3a8a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">normalize</text>
    <text x="118" y="492" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">字段口径统一</text>
  </g>
  <g>
    <rect x="304" y="414" width="170" height="110" rx="18" fill="#ecfdf5" stroke="#86efac" />
    <text x="342" y="458" fill="#14532d" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">dedupe</text>
    <text x="342" y="492" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">按 id 去重</text>
  </g>
  <g>
    <rect x="518" y="414" width="170" height="110" rx="18" fill="#fff7ed" stroke="#fdba74" />
    <text x="554" y="458" fill="#7c2d12" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">filter</text>
    <text x="548" y="492" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">按 range 过滤</text>
  </g>
  <g>
    <rect x="732" y="414" width="170" height="110" rx="18" fill="#fdf4ff" stroke="#d8b4fe" />
    <text x="762" y="458" fill="#581c87" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">aggregate</text>
    <text x="762" y="492" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">按用户汇总</text>
  </g>
  <g>
    <rect x="946" y="414" width="170" height="110" rx="18" fill="#fef2f2" stroke="#fca5a5" />
    <text x="992" y="458" fill="#7f1d1d" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">rank</text>
    <text x="980" y="492" fill="#334155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">按 metric 排序</text>
  </g>
  <path d="M262 469 H296" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M476 469 H510" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M690 469 H724" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M904 469 H938" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="180" y="600" width="840" height="72" rx="20" fill="#0f172a" />
  <text x="224" y="633" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800">输出 summary：users、daily、models、tools、totalTokens、totalCostUsd</text>
  <text x="224" y="660" fill="#bfdbfe" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">metric 可切换 tokens / cost / sessions / messages，range 可切换 1D / 7D / 30D / 90D。</text>
</svg>
