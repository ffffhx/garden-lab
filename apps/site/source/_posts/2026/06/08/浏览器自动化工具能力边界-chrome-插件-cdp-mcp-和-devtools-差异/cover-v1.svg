      .serif{font-family:Georgia,"Noto Serif SC","Songti SC",serif}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity="0.5" stroke="#cbd5e1" stroke-width="1">
    <path d="M80 110H1120"/>
    <path d="M80 190H1120"/>
    <path d="M80 270H1120"/>
    <path d="M80 350H1120"/>
    <path d="M80 430H1120"/>
    <path d="M80 510H1120"/>
    <path d="M180 70V590"/>
    <path d="M340 70V590"/>
    <path d="M500 70V590"/>
    <path d="M660 70V590"/>
    <path d="M820 70V590"/>
    <path d="M980 70V590"/>
  </g>
  <g transform="translate(84 74)">
