<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="chrome extensions 扩展页能力边界图">
  <defs>
    <style>
      .title{font-family:Georgia,"Noto Serif SC","Songti SC",serif;font-weight:700}
      .text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    </style>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="72" y="84" class="title" font-size="42" fill="#0f172a">为什么 chrome://extensions 是能力分界线</text>
  <text x="72" y="124" class="text" font-size="20" fill="#64748b">普通网页、扩展沙箱、CDP 调试面在这里会露出真实差异。</text>
  <g transform="translate(88 188)">
    <rect x="0" y="0" width="300" height="390" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="32" y="52" class="text" font-size="26" font-weight="700" fill="#1d4ed8">@chrome 插件</text>
    <text x="32" y="92" class="text" font-size="18" fill="#475569">站在 Chrome extension 沙箱里</text>
    <line x1="32" y1="122" x2="268" y2="122" stroke="#dbeafe" stroke-width="3"/>
    <text x="32" y="166" class="text" font-size="20" fill="#0f172a">优势</text>
    <text x="32" y="202" class="text" font-size="18" fill="#475569">真实 profile、现有 tab、登录态</text>
    <text x="32" y="256" class="text" font-size="20" fill="#0f172a">边界</text>
    <text x="32" y="292" class="text" font-size="18" fill="#475569">不适合接管 chrome://</text>
    <text x="32" y="326" class="text" font-size="18" fill="#475569">不能随便碰其他扩展 UI</text>
  </g>
  <g transform="translate(450 188)">
    <rect x="0" y="0" width="300" height="390" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="32" y="52" class="text" font-size="26" font-weight="700" fill="#c2410c">agent-browser</text>
    <text x="32" y="92" class="text" font-size="18" fill="#475569">站在 CDP / Playwright 面</text>
    <line x1="32" y1="122" x2="268" y2="122" stroke="#fed7aa" stroke-width="3"/>
    <text x="32" y="166" class="text" font-size="20" fill="#0f172a">优势</text>
    <text x="32" y="202" class="text" font-size="18" fill="#475569">可进 chrome://extensions</text>
    <text x="32" y="236" class="text" font-size="18" fill="#475569">可 auto-connect 真实 Chrome</text>
    <text x="32" y="290" class="text" font-size="20" fill="#0f172a">边界</text>
    <text x="32" y="326" class="text" font-size="18" fill="#475569">需要远程调试授权</text>
  </g>
  <g transform="translate(812 188)">
    <rect x="0" y="0" width="300" height="390" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="32" y="52" class="text" font-size="26" font-weight="700" fill="#be185d">DevTools MCP</text>
    <text x="32" y="92" class="text" font-size="18" fill="#475569">站在 DevTools / Puppeteer 面</text>
    <line x1="32" y1="122" x2="268" y2="122" stroke="#fbcfe8" stroke-width="3"/>
    <text x="32" y="166" class="text" font-size="20" fill="#0f172a">优势</text>
    <text x="32" y="202" class="text" font-size="18" fill="#475569">install / reload extension</text>
    <text x="32" y="236" class="text" font-size="18" fill="#475569">trigger extension action</text>
    <text x="32" y="290" class="text" font-size="20" fill="#0f172a">边界</text>
    <text x="32" y="326" class="text" font-size="18" fill="#475569">扩展工具当前要求 pipe</text>
  </g>
  <path d="M388 384H450" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <path d="M750 384H812" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <g transform="translate(288 626)">
    <rect x="0" y="0" width="624" height="58" rx="16" fill="#111827"/>
    <text x="32" y="38" class="mono" font-size="20" fill="#e5e7eb">chrome://extensions 不是普通网页，它暴露的是工具接入层级。</text>
  </g>
</svg>
