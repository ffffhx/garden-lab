<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Chrome 扩展 API 与 CDP 能力矩阵">
  <defs>
    <style>
      .title{font-family:Georgia,"Noto Serif SC","Songti SC",serif;font-weight:700}
      .text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fffaf4"/>
  <text x="72" y="84" class="title" font-size="42" fill="#0f172a">书签、历史、侧边栏、Network 不在同一个安全域</text>
  <text x="72" y="124" class="text" font-size="20" fill="#64748b">同名能力背后可能是 extension API，也可能是 CDP domain。</text>
  <g transform="translate(76 180)">
    <rect x="0" y="0" width="1048" height="486" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
    <g class="text" font-size="19">
      <rect x="0" y="0" width="1048" height="66" rx="22" fill="#0f172a"/>
      <text x="42" y="42" fill="#ffffff" font-weight="700">能力</text>
      <text x="260" y="42" fill="#ffffff" font-weight="700">Chrome extension API</text>
      <text x="570" y="42" fill="#ffffff" font-weight="700">CDP / DevTools</text>
      <text x="840" y="42" fill="#ffffff" font-weight="700">普通网页自动化</text>
      <g fill="#0f172a">
        <text x="42" y="116" font-weight="700">书签</text>
        <text x="260" y="116">chrome.bookmarks</text>
        <text x="570" y="116">无一等 domain</text>
        <text x="840" y="116">只能点 UI</text>
        <text x="42" y="184" font-weight="700">历史记录</text>
        <text x="260" y="184">chrome.history</text>
        <text x="570" y="184">非标准页面调试能力</text>
        <text x="840" y="184">只能看当前页 history</text>
        <text x="42" y="252" font-weight="700">侧边栏</text>
        <text x="260" y="252">chrome.sidePanel</text>
        <text x="570" y="252">可调试 panel target</text>
        <text x="840" y="252">不能创建原生侧边栏</text>
        <text x="42" y="320" font-weight="700">Network</text>
        <text x="260" y="320">webRequest / DNR</text>
        <text x="570" y="320">Network domain / waterfall</text>
        <text x="840" y="320">fetch 只能看自己发的</text>
        <text x="42" y="388" font-weight="700">扩展 reload</text>
        <text x="260" y="388">management / 开发者 UI</text>
        <text x="570" y="388">Extensions tool / Target</text>
        <text x="840" y="388">基本无能为力</text>
        <text x="42" y="456" font-weight="700">性能指标</text>
        <text x="260" y="456">Performance API 子集</text>
        <text x="570" y="456">Trace / Lighthouse / Metrics</text>
        <text x="840" y="456">页面 API 子集</text>
      </g>
    </g>
    <g stroke="#e2e8f0" stroke-width="2">
      <path d="M0 146H1048M0 214H1048M0 282H1048M0 350H1048M0 418H1048"/>
      <path d="M220 66V486M532 66V486M804 66V486"/>
    </g>
  </g>
  <text x="76" y="710" class="text" font-size="20" fill="#475569">结论：不要问“能不能操作浏览器”，要问“它拿到的是哪一个权限面”。</text>
</svg>
