<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="性能数据来源分层图">
  <defs>
    <style>
      .title{font-family:Georgia,"Noto Serif SC","Songti SC",serif;font-weight:700}
      .text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    </style>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f7fbff"/>
  <text x="72" y="84" class="title" font-size="42" fill="#0f172a">F12 性能数据不是一个 API</text>
  <text x="72" y="124" class="text" font-size="20" fill="#64748b">首屏、Network waterfall、Trace insight、Lighthouse 分数来自不同层。</text>
  <g transform="translate(92 180)">
    <rect x="0" y="0" width="1016" height="448" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <g transform="translate(50 54)">
      <rect x="0" y="0" width="210" height="96" rx="16" fill="#dbeafe" stroke="#93c5fd"/>
      <text x="28" y="38" class="text" font-size="23" font-weight="700" fill="#1d4ed8">页面 API</text>
      <text x="28" y="70" class="mono" font-size="17" fill="#2563eb">paint / navigation</text>
    </g>
    <g transform="translate(306 54)">
      <rect x="0" y="0" width="210" height="96" rx="16" fill="#dcfce7" stroke="#86efac"/>
      <text x="28" y="38" class="text" font-size="23" font-weight="700" fill="#15803d">CDP Network</text>
      <text x="28" y="70" class="mono" font-size="17" fill="#16a34a">headers / body / timing</text>
    </g>
    <g transform="translate(562 54)">
      <rect x="0" y="0" width="210" height="96" rx="16" fill="#ffedd5" stroke="#fdba74"/>
      <text x="28" y="38" class="text" font-size="23" font-weight="700" fill="#c2410c">Trace</text>
      <text x="28" y="70" class="mono" font-size="17" fill="#ea580c">tasks / layout / paint</text>
    </g>
    <g transform="translate(306 230)">
      <rect x="0" y="0" width="210" height="96" rx="16" fill="#fce7f3" stroke="#f9a8d4"/>
      <text x="28" y="38" class="text" font-size="23" font-weight="700" fill="#be185d">Lighthouse</text>
      <text x="28" y="70" class="mono" font-size="17" fill="#db2777">FCP / LCP / TBT</text>
    </g>
    <g transform="translate(562 230)">
      <rect x="0" y="0" width="300" height="96" rx="16" fill="#ede9fe" stroke="#c4b5fd"/>
      <text x="28" y="38" class="text" font-size="23" font-weight="700" fill="#6d28d9">DevTools MCP</text>
      <text x="28" y="70" class="mono" font-size="17" fill="#7c3aed">trace insight / network tools</text>
    </g>
    <path d="M260 102H306" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow4)"/>
    <path d="M516 102H562" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow4)"/>
    <path d="M667 150V230" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow4)"/>
    <path d="M516 278H562" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow4)"/>
    <text x="50" y="388" class="text" font-size="20" fill="#475569">同一个“首屏慢”，可能要看导航事件、paint entry、请求瀑布、主线程 trace 和 Lighthouse 诊断。</text>
  </g>
</svg>
