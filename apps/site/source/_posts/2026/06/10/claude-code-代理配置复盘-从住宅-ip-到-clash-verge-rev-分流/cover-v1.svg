<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 代理配置复盘封面</title>
  <desc id="desc">从住宅 IP 到 Clash Verge Rev 分流的 Claude Code 代理链路封面</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d7e0df" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#10212a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#f2f7f5"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.72"/>
  <rect x="70" y="58" width="1060" height="514" rx="18" fill="#fffefa" stroke="#132326" stroke-width="2" filter="url(#shadow)"/>

  <text x="112" y="126" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800">CLAUDE CODE PROXY NOTES</text>
  <text x="112" y="202" fill="#132326" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="56" font-weight="900">从住宅 IP 到 Clash 分流</text>
  <text x="114" y="252" fill="#526465" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="650">把出口 IP、系统代理、本机端口和规则命中分清楚</text>

  <g transform="translate(118 350)">
    <rect x="0" y="0" width="210" height="104" rx="14" fill="#e7f8f4" stroke="#0f766e" stroke-width="2"/>
    <text x="24" y="42" fill="#0b514c" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="850">应用</text>
    <text x="24" y="76" fill="#3b6965" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Chrome / CLI</text>
  </g>
  <path d="M350 402 H426" stroke="#132326" stroke-width="4" stroke-linecap="round"/>
  <path d="M426 402 l-13 -9 v18 z" fill="#132326"/>

  <g transform="translate(458 350)">
    <rect x="0" y="0" width="235" height="104" rx="14" fill="#fff4de" stroke="#b7791f" stroke-width="2"/>
    <text x="24" y="42" fill="#74450b" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="850">本机端口</text>
    <text x="24" y="76" fill="#7a5f2b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">127.0.0.1:7897</text>
  </g>
  <path d="M715 402 H790" stroke="#132326" stroke-width="4" stroke-linecap="round"/>
  <path d="M790 402 l-13 -9 v18 z" fill="#132326"/>

  <g transform="translate(822 350)">
    <rect x="0" y="0" width="250" height="104" rx="14" fill="#eaf1ff" stroke="#2f6fbb" stroke-width="2"/>
    <text x="24" y="42" fill="#245d83" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="850">规则出口</text>
    <text x="24" y="76" fill="#446c93" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Claude -> UK</text>
  </g>

  <text x="112" y="524" fill="#132326" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="650">AWS/VPS、住宅 IP、ISP proxy、HTTP/SOCKS、Clash Verge Rev、Mihomo、CLI 环境变量</text>
</svg>
