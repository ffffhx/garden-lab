<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude 代理分流总览</title>
  <desc id="desc">浏览器和 Claude Code CLI 如何通过本机代理端口进入 Mihomo 规则，再分别走英国代理或直连</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#203033"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#10212a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="620" fill="#f7faf8"/>
  <text x="60" y="72" fill="#132326" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900">这次最终采用的分流链路</text>
  <text x="62" y="112" fill="#637273" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600">不同应用先进入本机代理端口，Mihomo 根据目标域名决定走远端代理还是直连</text>

  <g transform="translate(74 175)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="115" rx="14" fill="#e7f8f4" stroke="#0f766e" stroke-width="2"/>
    <text x="24" y="42" fill="#0b514c" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="850">浏览器</text>
    <text x="24" y="76" fill="#3b6965" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">system proxy</text>
  </g>

  <g transform="translate(74 334)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="115" rx="14" fill="#e7f8f4" stroke="#0f766e" stroke-width="2"/>
    <text x="24" y="42" fill="#0b514c" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="850">Claude Code CLI</text>
    <text x="24" y="76" fill="#3b6965" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">HTTP_PROXY</text>
  </g>

  <path d="M 310 232 C 360 232 360 306 418 306" fill="none" stroke="#203033" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 310 390 C 360 390 360 314 418 314" fill="none" stroke="#203033" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(438 245)" filter="url(#shadow)">
    <rect x="0" y="0" width="278" height="135" rx="14" fill="#fff4de" stroke="#b7791f" stroke-width="2"/>
    <text x="28" y="45" fill="#74450b" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="850">本机代理端口</text>
    <text x="28" y="84" fill="#7a5f2b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">127.0.0.1:7897</text>
    <text x="28" y="112" fill="#7a5f2b" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="17">Clash Verge Rev 管理，Mihomo 执行</text>
  </g>

  <path d="M 735 313 H 823" fill="none" stroke="#203033" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(850 143)" filter="url(#shadow)">
    <rect x="0" y="0" width="282" height="135" rx="14" fill="#eaf1ff" stroke="#2f6fbb" stroke-width="2"/>
    <text x="26" y="45" fill="#245d83" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="850">Claude 相关域名</text>
    <text x="26" y="82" fill="#446c93" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">claude.ai / claude.com</text>
    <text x="26" y="110" fill="#446c93" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">anthropic.com -> UK</text>
  </g>

  <g transform="translate(850 362)" filter="url(#shadow)">
    <rect x="0" y="0" width="282" height="118" rx="14" fill="#f2f4f5" stroke="#788487" stroke-width="2"/>
    <text x="26" y="45" fill="#263739" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="850">其他域名</text>
    <text x="26" y="82" fill="#526063" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">MATCH -> DIRECT</text>
  </g>

  <path d="M 717 287 C 775 235 795 212 826 206" fill="none" stroke="#2f6fbb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 717 338 C 780 396 796 421 826 421" fill="none" stroke="#788487" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="78" y="548" fill="#526063" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="650">重点：IP 查询网站如果不在 Claude 规则里，会命中 DIRECT，所以首页 IP 信息不能代表 Claude 的出口。</text>
</svg>
