<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">本机代理请求链路</title>
  <desc id="desc">浏览器访问 Claude 时如何读取系统代理、连接本机端口、由 Mihomo 决定最终出口</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172326"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#10212a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="620" fill="#fbfcfb"/>
  <text x="60" y="72" fill="#132326" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900">浏览器不是被拦截，而是主动连接代理</text>
  <text x="62" y="112" fill="#637273" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600">代理链路发生在“准备发起网络连接”之后，不是发生在地址栏输入阶段</text>

  <g transform="translate(72 190)" filter="url(#shadow)">
    <rect width="190" height="105" rx="14" fill="#e7f8f4" stroke="#0f766e" stroke-width="2"/>
    <text x="24" y="43" fill="#0b514c" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="850">输入网址</text>
    <text x="24" y="75" fill="#3b6965" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">claude.ai</text>
  </g>

  <path d="M280 243 H350" stroke="#172326" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(372 190)" filter="url(#shadow)">
    <rect width="220" height="105" rx="14" fill="#fff4de" stroke="#b7791f" stroke-width="2"/>
    <text x="24" y="43" fill="#74450b" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="850">读取代理设置</text>
    <text x="24" y="75" fill="#7a5f2b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">macOS / browser</text>
  </g>

  <path d="M610 243 H680" stroke="#172326" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(702 190)" filter="url(#shadow)">
    <rect width="238" height="105" rx="14" fill="#eaf1ff" stroke="#2f6fbb" stroke-width="2"/>
    <text x="24" y="43" fill="#245d83" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="850">连接本机端口</text>
    <text x="24" y="75" fill="#446c93" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">127.0.0.1:7897</text>
  </g>

  <path d="M958 243 H1028" stroke="#172326" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(1050 190)" filter="url(#shadow)">
    <rect width="112" height="105" rx="14" fill="#f2f4f5" stroke="#788487" stroke-width="2"/>
    <text x="23" y="43" fill="#263739" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="850">规则</text>
    <text x="24" y="75" fill="#526063" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">route</text>
  </g>

  <path d="M1105 316 C 1105 360 1030 372 955 388" fill="none" stroke="#2f6fbb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1105 316 C 1105 445 1032 470 955 485" fill="none" stroke="#788487" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(642 354)" filter="url(#shadow)">
    <rect width="300" height="92" rx="14" fill="#eaf1ff" stroke="#2f6fbb" stroke-width="2"/>
    <text x="24" y="38" fill="#245d83" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="850">命中 Claude 规则</text>
    <text x="24" y="67" fill="#446c93" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">IPRoyal-UK -> target</text>
  </g>

  <g transform="translate(642 468)" filter="url(#shadow)">
    <rect width="300" height="82" rx="14" fill="#f2f4f5" stroke="#788487" stroke-width="2"/>
    <text x="24" y="36" fill="#263739" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="850">没有命中规则</text>
    <text x="24" y="63" fill="#526063" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">DIRECT -> target</text>
  </g>

  <text x="74" y="410" fill="#132326" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="850">关键区别</text>
  <text x="74" y="450" fill="#526063" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600">监听的是代理核心，不是浏览器。</text>
  <text x="74" y="482" fill="#526063" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600">浏览器在发起连接前读取代理设置。</text>
  <text x="74" y="514" fill="#526063" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600">是否走远端代理，要等本机代理按规则判断。</text>
</svg>
