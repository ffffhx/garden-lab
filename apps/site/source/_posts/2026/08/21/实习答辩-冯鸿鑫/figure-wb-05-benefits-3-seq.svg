<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .p-box { rx: 8; stroke-width: 1.5; }
      .p-text { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .msg-line { stroke: #3b82f6; stroke-width: 1.8; fill: none; }
      .msg-return { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
      .msg-text { font: 500 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .msg-bg { fill: #ffffff; rx: 4; stroke: #e2e8f0; stroke-width: 1; }
      .section-banner { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; rx: 6; }
      .section-title { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #c2410c; dominant-baseline: central; }
      .alt-frame { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 6; }
      .alt-badge { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #ffffff; dominant-baseline: central; text-anchor: middle; }
      .alt-cond { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
    <marker id="arrow-self" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect class="bg" width="1140" height="1280" rx="16"/>
  <rect class="frame" x="16" y="16" width="1108" height="1248" rx="14"/>

  <text class="title" x="48" y="58">商业化权益 3.0：跨端无头拦截与推导时序图</text>
  <text class="subtitle" x="48" y="84">业务逻辑与 UI 视图彻底解耦 · 统一判断与套餐推导 · 调用方仅传权益类型与新增量</text>
  <line class="lifeline" x1="100" y1="145" x2="100" y2="1205"/>
  <line class="lifeline" x1="380" y1="145" x2="380" y2="1205"/>
  <line class="lifeline" x1="700" y1="145" x2="700" y2="1205"/>
  <line class="lifeline" x1="1000" y1="145" x2="1000" y2="1205"/>

    <rect class="p-box" x="20" y="107" width="160" height="38" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="p-text" x="100" y="127" fill="#2563eb">用户</text>
    <rect class="p-box" x="300" y="107" width="160" height="38" fill="#f0f9ff" stroke="#bae6fd"/>
    <text class="p-text" x="380" y="127" fill="#0284c7">调用方 (业务功能入口)</text>
    <rect class="p-box" x="620" y="107" width="160" height="38" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text class="p-text" x="700" y="127" fill="#7c3aed">商业化侧 (统一权益能力)</text>
    <rect class="p-box" x="920" y="107" width="160" height="38" fill="#fffbeb" stroke="#fde68a"/>
    <text class="p-text" x="1000" y="127" fill="#d97706">商业化后端</text>
    <line class="msg-line" x1="100" y1="200" x2="378" y2="200" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="163.5" y="189" width="153" height="22"/>
    <text class="msg-text" x="240" y="200">触发受权益管控的操作</text>
    <line class="msg-line" x1="380" y1="245" x2="698" y2="245" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="354" y="234" width="372" height="22"/>
    <text class="msg-text" x="540" y="245">useBenefitCheck (权益类型, 本次新增量, 当前使用量)</text>
    <line class="msg-line" x1="700" y1="290" x2="998" y2="290" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="724" y="279" width="252" height="22"/>
    <text class="msg-text" x="850" y="290">查询套餐等级 / 权益策略 / 权益额度</text>
    <line class="msg-return" x1="1000" y1="335" x2="702" y2="335" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="787" y="324" width="126" height="22"/>
    <text class="msg-text" x="850" y="335">返回套餐权益数据</text>
    <path class="msg-line" d="M 700 365 C 738 361, 738 403, 703 399" marker-end="url(#arrow-self)"/>
    <rect class="msg-bg" x="744" y="371" width="337" height="22"/>
    <text class="msg-text" style="text-anchor: start;" x="752" y="382">统一权益判断：当前使用量 + 新增量 ≤ 权益额度？</text>
    <rect class="alt-frame" x="48" y="425" width="1044" height="690"/>
    <rect x="48" y="425" width="42" height="24" rx="4" fill="#475569"/>
    <text class="alt-badge" x="69" y="437">alt</text>

    <text class="alt-cond" x="100" y="437">[权益可用]</text>
  
    <line class="msg-return" x1="700" y1="475" x2="382" y2="475" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="463.5" y="464" width="153" height="22"/>
    <text class="msg-text" x="540" y="475">权益可用（未达上限）</text>
    <line class="msg-return" x1="380" y1="520" x2="102" y2="520" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="183.5" y="509" width="113" height="22"/>
    <text class="msg-text" x="240" y="520">继续执行原操作</text>
    <line class="divider" x1="48" y1="560" x2="1092" y2="560"/>
    <text class="alt-cond" x="100" y="576">[权益不足：拦截与推荐]</text>
  
    <path class="msg-line" d="M 700 595 C 738 591, 738 633, 703 629" marker-end="url(#arrow-self)"/>
    <rect class="msg-bg" x="744" y="601" width="313" height="22"/>
    <text class="msg-text" style="text-anchor: start;" x="752" y="612">套餐推导：按缺口自动推荐满足新增量的目标套餐</text>
    <line class="msg-line" x1="700" y1="665" x2="102" y2="665" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="242.5" y="654" width="315" height="22"/>
    <text class="msg-text" x="400" y="665">弹出权益拦截弹窗（权益文案由商业化集中管理）</text>
    <line class="msg-line" x1="100" y1="710" x2="698" y2="710" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="350.5" y="699" width="99" height="22"/>
    <text class="msg-text" x="400" y="710">用户确认升级</text>
    <line class="msg-line" x1="700" y1="755" x2="102" y2="755" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="289.5" y="744" width="221" height="22"/>
    <text class="msg-text" x="400" y="755">弹出专属支付弹窗，引导完成购买</text>
    <line class="msg-line" x1="100" y1="800" x2="698" y2="800" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="310" y="789" width="180" height="22"/>
    <text class="msg-text" x="400" y="800">完成支付（支付成功回调）</text>
    <line class="msg-line" x1="700" y1="845" x2="998" y2="845" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="748.5" y="834" width="203" height="22"/>
    <text class="msg-text" x="850" y="845">刷新 / 重新同步最新权益额度</text>
    <line class="msg-return" x1="700" y1="890" x2="382" y2="890" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="456.5" y="879" width="167" height="22"/>
    <text class="msg-text" x="540" y="890">权益已生效（放行操作）</text>
    <line class="msg-return" x1="380" y1="935" x2="102" y2="935" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="170" y="924" width="140" height="22"/>
    <text class="msg-text" x="240" y="935">继续（重试）原操作</text>
    <g transform="translate(68, 990)">
      <rect class="section-banner" x="0" y="0" width="1004" height="34"/>
      <text class="section-title" x="18" y="17">扩容类权益：可用性由业务方后端自行判断，商业化侧只收口统一拦截弹窗与支付流程</text>
    </g>
  
    <rect class="p-box" x="20" y="1205" width="160" height="34" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="p-text" x="100" y="1223" fill="#2563eb">用户</text>
    <rect class="p-box" x="300" y="1205" width="160" height="34" fill="#f0f9ff" stroke="#bae6fd"/>
    <text class="p-text" x="380" y="1223" fill="#0284c7">调用方 (业务功能入口)</text>
    <rect class="p-box" x="620" y="1205" width="160" height="34" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text class="p-text" x="700" y="1223" fill="#7c3aed">商业化侧 (统一权益能力)</text>
    <rect class="p-box" x="920" y="1205" width="160" height="34" fill="#fffbeb" stroke="#fde68a"/>
    <text class="p-text" x="1000" y="1223" fill="#d97706">商业化后端</text>
</svg>
