<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1860" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .p-box { rx: 8; stroke-width: 1.5; }
      .p-text { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .msg-line { stroke: #3b82f6; stroke-width: 1.8; fill: none; }
      .msg-return { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
      .msg-text { font: 500 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .msg-bg { fill: #ffffff; rx: 4; stroke: #e2e8f0; stroke-width: 1; }
      .section-banner { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; rx: 6; }
      .section-title { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #c2410c; dominant-baseline: central; }
      .alt-frame { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 6; }
      .alt-subframe { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 5; }
      .alt-badge { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #ffffff; dominant-baseline: central; text-anchor: middle; }
      .alt-cond { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 4; }
      .note-box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; rx: 6; }
      .note-text { font: 600 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b45309; text-anchor: middle; dominant-baseline: central; }
      .success-text { font: 700 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #16a34a; text-anchor: middle; dominant-baseline: central; }
      .fail-text { font: 700 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #dc2626; text-anchor: middle; dominant-baseline: central; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
    <marker id="arrow-self" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="1860" rx="16"/>
  <rect class="frame" x="16" y="16" width="1288" height="1828" rx="14"/>

  <text class="title" x="48" y="58">账号切换工具链：鉴权与切换时序图</text>
  <text class="subtitle" x="48" y="84">双重身份校验（ByteCloud OAuth + Kani）· 业务 Token 换 Session · 飞书静默无感复用</text>
  <line class="lifeline" x1="110" y1="145" x2="110" y2="1775"/>
  <line class="lifeline" x1="285" y1="145" x2="285" y2="1775"/>
  <line class="lifeline" x1="460" y1="145" x2="460" y2="1775"/>
  <line class="lifeline" x1="645" y1="145" x2="645" y2="1775"/>
  <line class="lifeline" x1="815" y1="145" x2="815" y2="1775"/>
  <line class="lifeline" x1="975" y1="145" x2="975" y2="1775"/>
  <line class="lifeline" x1="1130" y1="145" x2="1130" y2="1775"/>

    <rect class="p-box" x="44" y="107" width="132" height="38" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="p-text" x="110" y="127" fill="#2563eb">用户 / Agent</text>
    <rect class="p-box" x="219" y="107" width="132" height="38" fill="#f0f9ff" stroke="#bae6fd"/>
    <text class="p-text" x="285" y="127" fill="#0284c7">Chrome 插件</text>
    <rect class="p-box" x="394" y="107" width="132" height="38" fill="#eef2ff" stroke="#c7d2fe"/>
    <text class="p-text" x="460" y="127" fill="#6366f1">Stone (前端)</text>
    <rect class="p-box" x="579" y="107" width="132" height="38" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text class="p-text" x="645" y="127" fill="#7c3aed">ByteCloud OAuth</text>
    <rect class="p-box" x="749" y="107" width="132" height="38" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text class="p-text" x="815" y="127" fill="#0d9488">Kani (权限服务)</text>
    <rect class="p-box" x="909" y="107" width="132" height="38" fill="#fffbeb" stroke="#fde68a"/>
    <text class="p-text" x="975" y="127" fill="#d97706">Session 服务</text>
    <rect class="p-box" x="1064" y="107" width="132" height="38" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="p-text" x="1130" y="127" fill="#1d4ed8">Coze 页面</text>
    <g transform="translate(48, 160)">
      <rect class="section-banner" x="0" y="0" width="1224" height="32"/>
      <text class="section-title" x="18" y="16">一、获取业务 Token（首次登录 / Token 失效时）</text>
    </g>
    <line class="msg-line" x1="110" y1="220" x2="283" y2="220" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="161.5" y="209" width="72" height="22"/>
    <text class="msg-text" x="197.5" y="220">发起鉴权</text>
    <line class="msg-line" x1="285" y1="262" x2="458" y2="262" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="336.5" y="251" width="72" height="22"/>
    <text class="msg-text" x="372.5" y="262">请求鉴权</text>
    <line class="msg-line" x1="460" y1="304" x2="643" y2="304" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="449.5" y="293" width="206" height="22"/>
    <text class="msg-text" x="552.5" y="304">ByteCloud OAuth 授权重定向</text>
    <line class="msg-return" x1="645" y1="346" x2="112" y2="346" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="263.5" y="335" width="228" height="22"/>
    <text class="msg-text" x="377.5" y="346">弹出 OAuth 授权页面 / 确认提示</text>
    <line class="msg-line" x1="110" y1="388" x2="643" y2="388" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="274" y="377" width="207" height="22"/>
    <text class="msg-text" x="377.5" y="388">确认授权（使用企业员工账号）</text>
    <line class="msg-return" x1="645" y1="430" x2="462" y2="430" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="408.5" y="419" width="288" height="22"/>
    <text class="msg-text" x="552.5" y="430">返回员工身份凭证（OAuth Code / Token）</text>
    <line class="msg-line" x1="460" y1="472" x2="813" y2="472" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="538.5" y="461" width="198" height="22"/>
    <text class="msg-text" x="637.5" y="472">校验员工 Coze 内部业务权限</text>
    <line class="msg-return" x1="815" y1="514" x2="462" y2="514" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="534" y="503" width="207" height="22"/>
    <text class="msg-text" x="637.5" y="514">鉴权通过（具备对应项目权限）</text>
    <line class="msg-return" x1="460" y1="556" x2="287" y2="556" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="266.5" y="545" width="212" height="22"/>
    <text class="msg-text" x="372.5" y="556">签发业务 Token（含过期时间）</text>
    <rect class="note-box" x="195" y="586" width="180" height="28"/>
    <text class="note-text" x="285" y="600">仅持有受限业务 Token</text>
  
    <g transform="translate(48, 638)">
      <rect class="section-banner" x="0" y="0" width="1224" height="32"/>
      <text class="section-title" x="18" y="16">二、账号切换与环境校验</text>
    </g>
    <line class="msg-line" x1="110" y1="698" x2="283" y2="698" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="62.5" y="687" width="270" height="22"/>
    <text class="msg-text" x="197.5" y="698">选择操作：切回本人账号 / 切换测试账号</text>
    <rect class="alt-frame" x="48" y="735" width="1224" height="980"/>
    <rect x="48" y="735" width="42" height="24" rx="4" fill="#475569"/>
    <text class="alt-badge" x="69" y="747">alt</text>

    <text class="alt-cond" x="100" y="747">[切回本人账号]</text>
  
    <line class="msg-line" x1="285" y1="780" x2="1128" y2="780" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="562" y="769" width="291" height="22"/>
    <text class="msg-text" x="707.5" y="780">Tab 跳转 Coze 页面（携带 prompt=none）</text>
    <path class="msg-line" d="M 1130 806 C 1168 802, 1168 844, 1133 840" marker-end="url(#arrow-self)"/>
    <rect class="msg-bg" x="1174" y="812" width="192" height="22"/>
    <text class="msg-text" style="text-anchor: start;" x="1182" y="823">复用飞书登录态（静默登录）</text>
    <line class="msg-return" x1="1130" y1="874" x2="112" y2="874" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="523" y="863" width="194" height="22"/>
    <text class="msg-text" x="620" y="874">完成切换（恢复为本人身份）</text>
    <line class="divider" x1="48" y1="910" x2="1272" y2="910"/>
    <text class="alt-cond" x="100" y="926">[切换测试账号]</text>
  
    <line class="msg-line" x1="110" y1="955" x2="283" y2="955" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="134.5" y="944" width="126" height="22"/>
    <text class="msg-text" x="197.5" y="955">选择目标测试账号</text>
    <line class="msg-line" x1="285" y1="998" x2="1128" y2="998" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="624" y="987" width="167" height="22"/>
    <text class="msg-text" x="707.5" y="998">检查当前已登录账号信息</text>
    <rect class="alt-subframe" x="66" y="1035" width="1188" height="655"/>
    <rect x="66" y="1035" width="42" height="22" rx="4" fill="#64748b"/>
    <text class="alt-badge" x="87" y="1046">alt</text>

    <text class="alt-cond" x="118" y="1046">[已是目标账号]</text>
  
    <line class="msg-return" x1="285" y1="1080" x2="112" y2="1080" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="87" y="1069" width="221" height="22"/>
    <text class="msg-text" x="197.5" y="1080">当前已在该测试账号下，直接完成</text>
    <line class="divider" x1="66" y1="1118" x2="1254" y2="1118"/>
    <text class="alt-cond" x="118" y="1133">[非目标账号：执行 Cookie 换绑]</text>
  
    <line class="msg-line" x1="285" y1="1162" x2="458" y2="1162" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="230" y="1151" width="285" height="22"/>
    <text class="msg-text" x="372.5" y="1162">请求目标账号 Session（携带业务 Token）</text>
    <line class="msg-line" x1="460" y1="1206" x2="973" y2="1206" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="605.5" y="1195" width="224" height="22"/>
    <text class="msg-text" x="717.5" y="1206">通过测试 UID 换取合法 Session</text>
    <line class="msg-return" x1="975" y1="1250" x2="462" y2="1250" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="634" y="1239" width="167" height="22"/>
    <text class="msg-text" x="717.5" y="1250">返回有效 Session 数据</text>
    <line class="msg-return" x1="460" y1="1294" x2="287" y2="1294" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="275.5" y="1283" width="194" height="22"/>
    <text class="msg-text" x="372.5" y="1294">返回目标账号 Session 凭证</text>
    <line class="msg-line" x1="285" y1="1338" x2="1128" y2="1338" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="543" y="1327" width="329" height="22"/>
    <text class="msg-text" x="707.5" y="1338">替换目标 Cookie（注入 Coze Session Cookie）</text>
    <line class="msg-line" x1="285" y1="1382" x2="1128" y2="1382" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="552" y="1371" width="311" height="22"/>
    <text class="msg-text" x="707.5" y="1382">触发页面刷新 / 校验当前账号、所属企业与权限</text>
    <rect class="alt-frame" style="fill: #ffffff; stroke: #cbd5e1;" x="84" y="1422" width="1152" height="243"/>
    <rect x="84" y="1422" width="38" height="20" rx="3" fill="#94a3b8"/>
    <text class="alt-badge" style="font-size: 11px;" x="103" y="1432">alt</text>

    <text class="alt-cond" x="132" y="1432">[校验一致]</text>
  
    <line class="msg-return" style="stroke: #16a34a;" x1="285" y1="1485" x2="112" y2="1485" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" style="stroke: #bbf7d0; fill: #f0fdf4;" x="120" y="1472" width="156" height="26"/>
    <text class="success-text" x="198" y="1485">✅ 切换成功 (耗时 &lt;10s)</text>
  
    <line class="divider" x1="84" y1="1545" x2="1236" y2="1545"/>
    <text class="alt-cond" x="132" y="1560">[不一致 / Session 失效]</text>
  
    <line class="msg-return" style="stroke: #dc2626;" x1="285" y1="1610" x2="112" y2="1610" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" style="stroke: #fecaca; fill: #fef2f2;" x="110" y="1597" width="176" height="26"/>
    <text class="fail-text" x="198" y="1610">❌ 切换失败，提示重新授权</text>
  
    <rect class="p-box" x="44" y="1775" width="132" height="34" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="p-text" x="110" y="1793" fill="#2563eb">用户 / Agent</text>
    <rect class="p-box" x="219" y="1775" width="132" height="34" fill="#f0f9ff" stroke="#bae6fd"/>
    <text class="p-text" x="285" y="1793" fill="#0284c7">Chrome 插件</text>
    <rect class="p-box" x="394" y="1775" width="132" height="34" fill="#eef2ff" stroke="#c7d2fe"/>
    <text class="p-text" x="460" y="1793" fill="#6366f1">Stone (前端)</text>
    <rect class="p-box" x="579" y="1775" width="132" height="34" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text class="p-text" x="645" y="1793" fill="#7c3aed">ByteCloud OAuth</text>
    <rect class="p-box" x="749" y="1775" width="132" height="34" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text class="p-text" x="815" y="1793" fill="#0d9488">Kani (权限服务)</text>
    <rect class="p-box" x="909" y="1775" width="132" height="34" fill="#fffbeb" stroke="#fde68a"/>
    <text class="p-text" x="975" y="1793" fill="#d97706">Session 服务</text>
    <rect class="p-box" x="1064" y="1775" width="132" height="34" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="p-text" x="1130" y="1793" fill="#1d4ed8">Coze 页面</text>
</svg>
