<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 1860" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .p-box { rx: 8; stroke-width: 1.5; }
      .p-text { font: 600 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .msg-line { stroke: #3b82f6; stroke-width: 1.8; fill: none; }
      .msg-return { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
      .msg-text { font: 500 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .msg-bg { fill: #ffffff; rx: 4; stroke: #e2e8f0; stroke-width: 1; }
      .section-banner { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; rx: 6; }
      .section-title { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #c2410c; dominant-baseline: central; }
      .alt-frame { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 6; }
      .opt-frame { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.2; rx: 6; }
      .loop-frame { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.2; rx: 6; }
      .alt-badge { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #ffffff; dominant-baseline: central; text-anchor: middle; }
      .alt-cond { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
    <marker id="arrow-self" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect class="bg" width="1380" height="1860" rx="16"/>
  <rect class="frame" x="16" y="16" width="1348" height="1828" rx="14"/>

  <text class="title" x="48" y="58">ProfilePilot：多 Agent 调度与受控 CDP 通信时序图</text>
  <text class="subtitle" x="48" y="84">Gateway 集中管理 Chrome Profile 租约 · 一次性 Ticket 防篡改 · 独立 Pipe 转发 · 人机无缝暂停与接管</text>
  <line class="lifeline" x1="120" y1="145" x2="120" y2="1785"/>
  <line class="lifeline" x1="340" y1="145" x2="340" y2="1785"/>
  <line class="lifeline" x1="560" y1="145" x2="560" y2="1785"/>
  <line class="lifeline" x1="780" y1="145" x2="780" y2="1785"/>
  <line class="lifeline" x1="1010" y1="145" x2="1010" y2="1785"/>
  <line class="lifeline" x1="1240" y1="145" x2="1240" y2="1785"/>

    <rect class="p-box" x="36" y="107" width="168" height="38" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="p-text" x="120" y="127" fill="#2563eb">Agent (Codex/Claude Code)</text>
    <rect class="p-box" x="256" y="107" width="168" height="38" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="p-text" x="340" y="127" fill="#64748b">~/.zshenv (环境层)</text>
    <rect class="p-box" x="476" y="107" width="168" height="38" fill="#f0f9ff" stroke="#bae6fd"/>
    <text class="p-text" x="560" y="127" fill="#0284c7">agent-browser Wrapper</text>
    <rect class="p-box" x="696" y="107" width="168" height="38" fill="#eef2ff" stroke="#c7d2fe"/>
    <text class="p-text" x="780" y="127" fill="#6366f1">agent-browser Daemon</text>
    <rect class="p-box" x="926" y="107" width="168" height="38" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text class="p-text" x="1010" y="127" fill="#7c3aed">Gateway (租约权威)</text>
    <rect class="p-box" x="1156" y="107" width="168" height="38" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text class="p-text" x="1240" y="127" fill="#0d9488">真实 Chrome Profile</text>
    <line class="msg-return" x1="340" y1="195" x2="122" y2="195" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="42.5" y="184" width="375" height="22"/>
    <text class="msg-text" x="230" y="195">注入 AGENT_BROWSER_SESSION=cc-xxx（Agent 零感知）</text>
    <line class="msg-line" x1="120" y1="240" x2="558" y2="240" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="145" y="229" width="390" height="22"/>
    <text class="msg-text" x="340" y="240">agent-browser --cdp 9223 open ... (不带 --session)</text>
    <path class="msg-line" d="M 560 270 C 598 266, 598 308, 563 304" marker-end="url(#arrow-self)"/>
    <rect class="msg-bg" x="604" y="276" width="313" height="22"/>
    <text class="msg-text" style="text-anchor: start;" x="612" y="287">解析 session=cc-xxx + requestedPort=9223</text>
    <line class="msg-line" x1="560" y1="335" x2="1008" y2="335" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="577" y="324" width="416" height="22"/>
    <text class="msg-text" x="785" y="335">acquire(requestedPort=9223, session, autoSwitch=true)</text>
    <path class="msg-line" d="M 1010 365 C 1048 361, 1048 403, 1013 399" marker-end="url(#arrow-self)"/>
    <rect class="msg-bg" x="1054" y="371" width="232" height="22"/>
    <text class="msg-text" style="text-anchor: start;" x="1062" y="382">读取目标 Profile 与候选备用配置</text>
    <rect class="alt-frame" x="48" y="425" width="1284" height="240"/>
    <rect x="48" y="425" width="42" height="24" rx="4" fill="#475569"/>
    <text class="alt-badge" x="69" y="437">alt</text>

    <text class="alt-cond" x="100" y="437">[目标 Profile 空闲]</text>
  
    <path class="msg-line" d="M 1010 460 C 1048 456, 1048 498, 1013 494" marker-end="url(#arrow-self)"/>
    <rect class="msg-bg" x="1054" y="466" width="181" height="22"/>
    <text class="msg-text" style="text-anchor: start;" x="1062" y="477">原子绑定 9223 ↔ cc-xxx</text>
    <line class="divider" x1="48" y1="510" x2="1332" y2="510"/>
    <text class="alt-cond" x="100" y="526">[目标 Profile 被占用，且有可用候选]</text>
  
    <path class="msg-line" d="M 1010 540 C 1048 536, 1048 578, 1013 574" marker-end="url(#arrow-self)"/>
    <rect class="msg-bg" x="1054" y="546" width="300" height="22"/>
    <text class="msg-text" style="text-anchor: start;" x="1062" y="557">自动选择可用候选并原子绑定（无需用户确认）</text>
    <line class="divider" x1="48" y1="590" x2="1332" y2="590"/>
    <text class="alt-cond" x="100" y="606">[目标 Profile 被占用，且无可用候选]</text>
  
    <line class="msg-return" x1="1010" y1="635" x2="562" y2="635" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="635.5" y="624" width="299" height="22"/>
    <text class="msg-text" x="785" y="635">返回 PROFILE_ALREADY_IN_USE（阻断执行）</text>
    <g transform="translate(48, 680)">
      <rect class="section-banner" x="0" y="0" width="1284" height="32"/>
      <text class="section-title" x="18" y="16">以下步骤仅在 Gateway 成功建立租约后继续</text>
    </g>
  
    <rect class="opt-frame" x="48" y="728" width="1284" height="82"/>
    <rect x="48" y="728" width="42" height="24" rx="4" fill="#16a34a"/>
    <text class="alt-badge" x="69" y="740">opt</text>
    <text class="alt-cond" style="fill: #166534;" x="100" y="740">[选中的 Chrome Profile 未启动]</text>
  
    <line class="msg-line" x1="1010" y1="772" x2="1238" y2="772" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="888.5" y="761" width="473" height="22"/>
    <text class="msg-text" x="1125" y="772">spawn 浏览器（--remote-debugging-pipe 独占，无真实对外开放端口）</text>
    <line class="msg-return" x1="1010" y1="845" x2="562" y2="845" marker-end="url(#arrow-return)"/>
    <rect class="msg-bg" x="622" y="834" width="326" height="22"/>
    <text class="msg-text" x="785" y="845">返回 chosenProfile + 一次性 Ticket + wsUrl</text>
    <line class="msg-line" x1="560" y1="890" x2="778" y2="890" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="558" y="879" width="224" height="22"/>
    <text class="msg-text" x="670" y="890">启动或复用 daemon，传入 wsUrl</text>
    <line class="msg-line" x1="780" y1="935" x2="1008" y2="935" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="781.5" y="924" width="227" height="22"/>
    <text class="msg-text" x="895" y="935">WebSocket 握手（携带 Ticket）</text>
    <path class="msg-line" d="M 1010 965 C 1048 961, 1048 1003, 1013 999" marker-end="url(#arrow-self)"/>
    <rect class="msg-bg" x="1054" y="971" width="316" height="22"/>
    <text class="msg-text" style="text-anchor: start;" x="1062" y="982">校验 Ticket（签名有效性 / 防过期 / 防重放）</text>
    <line class="msg-line" x1="560" y1="1030" x2="778" y2="1030" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="620.5" y="1019" width="99" height="22"/>
    <text class="msg-text" x="670" y="1030">执行当前指令</text>
    <rect class="loop-frame" x="48" y="1075" width="1284" height="175"/>
    <rect x="48" y="1075" width="46" height="24" rx="4" fill="#7c3aed"/>
    <text class="alt-badge" x="71" y="1087">loop</text>
    <text class="alt-cond" style="fill: #5b21b6;" x="104" y="1087">[当前命令产生的每条 CDP 消息]</text>
  
    <line class="msg-line" x1="780" y1="1120" x2="1008" y2="1120" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="826.5" y="1109" width="137" height="22"/>
    <text class="msg-text" x="895" y="1120">发送 CDP 原始请求</text>
    <path class="msg-line" d="M 1010 1148 C 1048 1144, 1048 1186, 1013 1182" marker-end="url(#arrow-self)"/>
    <rect class="msg-bg" x="1054" y="1154" width="325" height="22"/>
    <text class="msg-text" style="text-anchor: start;" x="1062" y="1165">校验 Session 控制权 + 控制代次 (Generation)</text>
    <line class="msg-line" x1="1010" y1="1215" x2="1238" y2="1215" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="1015.5" y="1204" width="219" height="22"/>
    <text class="msg-text" x="1125" y="1215">通过 Dedicated Pipe 转发执行</text>
    <g transform="translate(48, 1270)">
      <rect class="section-banner" x="0" y="0" width="1284" height="32"/>
      <text class="section-title" x="18" y="16">用户接管 → park（保持长连 · 拦截命令 · 缓存事件）；交还 → resume（Agent 重新 snapshot）</text>
    </g>
  
    <rect class="alt-frame" x="48" y="1320" width="1284" height="180"/>
    <rect x="48" y="1320" width="42" height="24" rx="4" fill="#475569"/>
    <text class="alt-badge" x="69" y="1332">alt</text>

    <text class="alt-cond" x="100" y="1332">[任务正常完成]</text>
  
    <line class="msg-line" x1="120" y1="1365" x2="558" y2="1365" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="199.5" y="1354" width="281" height="22"/>
    <text class="msg-text" x="340" y="1365">agent-browser profilepilot complete</text>
    <line class="divider" x1="48" y1="1410" x2="1332" y2="1410"/>
    <text class="alt-cond" x="100" y="1426">[明确放弃任务]</text>
  
    <line class="msg-line" x1="120" y1="1455" x2="558" y2="1455" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="203.5" y="1444" width="273" height="22"/>
    <text class="msg-text" x="340" y="1455">agent-browser profilepilot release</text>
    <line class="msg-line" x1="560" y1="1545" x2="1008" y2="1545" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="647.5" y="1534" width="275" height="22"/>
    <text class="msg-text" x="785" y="1545">通知结束 Session 并释放 Profile 租约</text>
    <line class="msg-line" x1="560" y1="1590" x2="778" y2="1590" marker-end="url(#arrow)"/>
    <rect class="msg-bg" x="604" y="1579" width="132" height="22"/>
    <text class="msg-text" x="670" y="1590">结束 daemon 进程</text>
    <rect class="p-box" x="36" y="1785" width="168" height="34" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="p-text" x="120" y="1803" fill="#2563eb">Agent (Codex/Claude Code)</text>
    <rect class="p-box" x="256" y="1785" width="168" height="34" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="p-text" x="340" y="1803" fill="#64748b">~/.zshenv (环境层)</text>
    <rect class="p-box" x="476" y="1785" width="168" height="34" fill="#f0f9ff" stroke="#bae6fd"/>
    <text class="p-text" x="560" y="1803" fill="#0284c7">agent-browser Wrapper</text>
    <rect class="p-box" x="696" y="1785" width="168" height="34" fill="#eef2ff" stroke="#c7d2fe"/>
    <text class="p-text" x="780" y="1803" fill="#6366f1">agent-browser Daemon</text>
    <rect class="p-box" x="926" y="1785" width="168" height="34" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text class="p-text" x="1010" y="1803" fill="#7c3aed">Gateway (租约权威)</text>
    <rect class="p-box" x="1156" y="1785" width="168" height="34" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text class="p-text" x="1240" y="1803" fill="#0d9488">真实 Chrome Profile</text>
</svg>
