[package]
name = "garden-lab-desktop-pet"
version = "0.1.0"
description = "A lightweight desktop pet for Garden Lab"
authors = ["Garden Lab"]
edition = "2021"

[lib]
name = "garden_lab_desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
