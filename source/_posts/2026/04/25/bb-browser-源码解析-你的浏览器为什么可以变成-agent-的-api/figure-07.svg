<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .bg { fill: #fbf7ef; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24313f; }
      .sub { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #627080; }
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24313f; }
      .text { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #394657; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6b78; }
      .box { stroke: #d6c8b6; stroke-width: 2; rx: 18; }
      .arrow { stroke: #7b8794; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .warn { fill: #fff1d5; stroke: #e0a23c; stroke-width: 2; rx: 18; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7b8794" />
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760" />
  <text class="title" x="72" y="78">bb-browser 登录态复用的真实边界</text>
  <text class="sub" x="72" y="112">关键不是“哪个账号”，而是 Chrome 进程加载了哪个 user-data-dir 和 profile</text>

  <rect class="box" x="72" y="166" width="310" height="228" fill="#eef5f8" />
  <text class="label" x="104" y="214">日常 Chrome</text>
  <text class="text" x="104" y="258">默认 user-data-dir</text>
  <text class="small" x="104" y="292">~/Library/Application Support/Google/Chrome</text>
  <text class="text" x="104" y="336">Default / Profile 1 / Profile 2</text>
  <text class="small" x="104" y="368">保存个人账号、扩展、历史和 Cookie</text>

  <rect class="warn" x="445" y="166" width="310" height="228" />
  <text class="label" x="477" y="214">Chrome 136+ 限制</text>
  <text class="text" x="477" y="258">默认数据目录不再适合</text>
  <text class="text" x="477" y="290">直接打开 remote debugging</text>
  <text class="small" x="477" y="336">原因：CDP 能控制页面并读取登录态</text>
  <text class="small" x="477" y="368">调试应使用非默认 user-data-dir</text>

  <rect class="box" x="818" y="166" width="310" height="228" fill="#edf7ed" />
  <text class="label" x="850" y="214">bb-browser 托管 Chrome</text>
  <text class="text" x="850" y="258">独立 user-data-dir</text>
  <text class="small" x="850" y="292">~/.bb-browser/browser/user-data</text>
  <text class="text" x="850" y="336">默认 profile 通常是 Default</text>
  <text class="small" x="850" y="368">登录一次后，后续由 bb-browser 复用</text>

  <path class="arrow" d="M382 280 C410 280, 418 280, 445 280" />
  <path class="arrow" d="M755 280 C785 280, 790 280, 818 280" />

  <rect class="box" x="182" y="474" width="384" height="144" fill="#f7f0fb" />
  <text class="label" x="214" y="522">推荐共享方案</text>
  <text class="text" x="214" y="562">创建专用自动化 profile</text>
  <text class="small" x="214" y="594">例如：~/.chrome-bb-profile</text>

  <rect class="box" x="646" y="474" width="384" height="144" fill="#f1f5ff" />
  <text class="label" x="678" y="522">bb-browser 连接方式</text>
  <text class="text" x="678" y="562">--port 或 BB_BROWSER_CDP_URL</text>
  <text class="small" x="678" y="594">连接已经开启 CDP 的 Chrome 进程</text>

  <path class="arrow" d="M566 546 C598 546, 614 546, 646 546" />
  <text class="small" x="72" y="700">实践结论：不要直接把日常 Chrome 默认 profile 暴露给调试端口；用专门的自动化 profile 复用登录态更稳。</text>
</svg>
