<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 最近一个月更新时间线</title>
  <desc id="desc">展示 2026 年 4 月 Claude Code 的主要更新节点。</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="70" y="76" fill="#111827" font-family="Arial, 'PingFang SC', sans-serif" font-size="36" font-weight="800">Claude Code 的主线：本地 CLI 与云端 Agent 编排合流</text>
  <text x="72" y="118" fill="#64748b" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Opus 4.7、Routines、Ultraplan、Ultrareview、Monitor 和 Claude Security 把 Claude Code 推向平台化。</text>
  <line x1="120" y1="385" x2="1080" y2="385" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <g transform="translate(80 190)">
      <circle cx="35" cy="195" r="16" fill="#0f766e"/>
      <rect x="0" y="0" width="205" height="132" rx="18" fill="#ccfbf1" stroke="#5eead4"/>
      <text x="24" y="38" fill="#115e59" font-size="20" font-weight="700">4 月 6-10 日</text>
      <text x="24" y="74" fill="#1e293b" font-size="18">Ultraplan</text>
      <text x="24" y="104" fill="#1e293b" font-size="18">Monitor / loop</text>
    </g>
    <g transform="translate(275 430)">
      <circle cx="35" cy="-45" r="16" fill="#b45309"/>
      <rect x="0" y="0" width="205" height="132" rx="18" fill="#ffedd5" stroke="#fdba74"/>
      <text x="24" y="38" fill="#92400e" font-size="20" font-weight="700">4 月 13-17 日</text>
      <text x="24" y="74" fill="#1e293b" font-size="18">Opus 4.7</text>
      <text x="24" y="104" fill="#1e293b" font-size="18">Routines</text>
    </g>
    <g transform="translate(475 190)">
      <circle cx="35" cy="195" r="16" fill="#7c3aed"/>
      <rect x="0" y="0" width="220" height="132" rx="18" fill="#ede9fe" stroke="#c4b5fd"/>
      <text x="24" y="38" fill="#5b21b6" font-size="20" font-weight="700">4 月 20-24 日</text>
      <text x="24" y="74" fill="#1e293b" font-size="18">Ultrareview</text>
      <text x="24" y="104" fill="#1e293b" font-size="18">Web redesign</text>
    </g>
    <g transform="translate(700 430)">
      <circle cx="35" cy="-45" r="16" fill="#dc2626"/>
      <rect x="0" y="0" width="220" height="132" rx="18" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="24" y="38" fill="#991b1b" font-size="20" font-weight="700">4 月 23 日</text>
      <text x="24" y="74" fill="#1e293b" font-size="18">质量复盘</text>
      <text x="24" y="104" fill="#1e293b" font-size="18">修复 effort / thinking</text>
    </g>
    <g transform="translate(920 190)">
      <circle cx="35" cy="195" r="16" fill="#2563eb"/>
      <rect x="0" y="0" width="205" height="132" rx="18" fill="#dbeafe" stroke="#93c5fd"/>
      <text x="24" y="38" fill="#1e3a8a" font-size="20" font-weight="700">4 月 30 日</text>
      <text x="24" y="74" fill="#1e293b" font-size="18">Claude Security</text>
      <text x="24" y="104" fill="#1e293b" font-size="18">Enterprise beta</text>
    </g>
  </g>
</svg>
