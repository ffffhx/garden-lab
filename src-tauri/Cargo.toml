[package]
name = "blog-desktop-pet"
version = "0.1.0"
description = "A lightweight desktop pet for the blog"
authors = ["Blog"]
edition = "2021"

[lib]
name = "blog_desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
